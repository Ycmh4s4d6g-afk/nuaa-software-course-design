<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>退款申请 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:600;
    margin:20px 0 8px;
    text-align:center;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
    font-weight:600;
}
.input, textarea{
    width:100%;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:10px 12px;
    font-size:13px;
    box-sizing:border-box;
}
.input{
    height:44px;
}
textarea{
    resize:none;
    height:100px;
}

/* 按钮 */
.btn-submit{
    width:100%;
    text-align:center;
    padding:14px 0;
    border-radius:18px;
    background:#dc2626;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:none;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='reservationList.html'">←</span>
    退款申请
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">退款申请</div>

    <div class="field">
        <div class="field-label">退款订单号</div>
        <input type="text" class="input" placeholder="如：20250220101">
    </div>

    <div class="field">
        <div class="field-label">退款原因说明</div>
        <textarea class="input" placeholder="如：行程变更 / 下错订单 / 感染生病等"></textarea>
    </div>

    <div class="field">
        <div class="field-label">退款金额</div>
        <input type="text" class="input" value="￥1040">
    </div>

    <div class="btn-submit" onclick="apply()">提交退款申请</div>

</div>

    </div>
</div>

<script>
function apply(){
    alert("退款申请已提交，等待管理员审核");
    location.href="reservationList.html";
}
</script>

</body>
</html>
