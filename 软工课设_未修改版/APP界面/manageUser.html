<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户管理后台 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
    body{
        margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
    }
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}

/* 搜索框 */
    .search-box{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}
.search-input{
    flex:1;
    height:40px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:13px;
    box-sizing:border-box;
}
.search-btn{
    flex:0 0 70px;
    text-align:center;
    padding:10px 0;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    border:none;
    font-size:13px;
    cursor:pointer;
}

/* 用户卡片 */
.user-card{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    box-sizing:border-box;
    }
.user-id{
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}
.user-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:6px;
}
.user-info{
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
    }
.user-status{
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
}
.status-normal{
    color:#16a34a;
}
.status-cancelled{
    color:#dc2626;
}
.user-actions{
    display:flex;
    gap:8px;
}
.btn{
    flex:1;
    text-align:center;
    padding:6px 0;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    border:none;
}
.btn-edit{
    background:#0284c7;
    color:#fff;
}
.btn-del{
    background:#dc2626;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='adminIndex.html'">←</span>
    用户管理
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">用户管理后台</div>

<div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索用户">
        <div class="search-btn" onclick="searchUser()">搜索</div>
    </div>

    <div class="user-card">
        <div class="user-id">用户ID: U20250101</div>
        <div class="user-name">李明</div>
        <div class="user-info">邮箱: chen@mail.com</div>
        <div class="user-info">手机: 13812345678</div>
        <div class="user-status status-normal">状态: 正常</div>
        <div class="user-actions">
            <div class="btn btn-edit" onclick="location.href='changeUserInfo.html'">修改</div>
            <div class="btn btn-del" onclick="deleteUser(this)">删除</div>
        </div>
    </div>

    <div class="user-card">
        <div class="user-id">用户ID: U20240215</div>
        <div class="user-name">王敏</div>
        <div class="user-info">邮箱: min@mail.com</div>
        <div class="user-info">手机: 13699881562</div>
        <div class="user-status status-cancelled">状态: 已注销</div>
        <div class="user-actions">
            <div class="btn btn-edit" onclick="location.href='changeUserInfo.html'">修改</div>
            <div class="btn btn-del" onclick="deleteUser(this)">删除</div>
        </div>
    </div>

    <div class="user-card">
        <div class="user-id">用户ID: U20250111</div>
        <div class="user-name">Alice</div>
        <div class="user-info">邮箱: alice@gmail.com</div>
        <div class="user-info">手机: 13755664421</div>
        <div class="user-status status-normal">状态: 正常</div>
        <div class="user-actions">
            <div class="btn btn-edit" onclick="location.href='changeUserInfo.html'">修改</div>
            <div class="btn btn-del" onclick="deleteUser(this)">删除</div>
        </div>
    </div>

</div>

    </div>
</div>

<script>
function searchUser(){
    let keyword = document.getElementById("searchInput").value.trim();
    if(keyword === "") {
        alert("请输入搜索关键字！");
        return;
    }
    alert("正在搜索包含：" + keyword + " 的用户记录（演示）");
}

function deleteUser(btn){
    if(confirm("⚠ 确认删除该用户？删除后无法恢复！")){
        btn.closest('.user-card').remove();
        alert("已删除");
    }
}
</script>

</body>
</html>
