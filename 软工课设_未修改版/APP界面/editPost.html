<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>编辑评论贴 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    }

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 12px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:16px;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input, select, textarea{
    width:100%;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:10px 12px;
    font-size:13px;
    box-sizing:border-box;
    }
.input, select{
    height:44px;
}
textarea{
    resize:none;
    height:120px;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    }
.btn-save{
    background:#4f46e5;
    color:#fff;
}
.btn-cancel{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='listPost.html'">←</span>
    编辑评论
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">修改我的评论</div>
    <div class="sub-text">你可以对原有的标题、评分和正文进行调整</div>

    <div class="field">
        <div class="field-label">关联酒店</div>
        <select class="input" id="hotel">
        <option selected>杭州西湖云舍民宿</option>
        <option>上海外滩星程酒店</option>
        <option>南京紫峰大厦精选酒店</option>
    </select>
    </div>

    <div class="field">
        <div class="field-label">评论标题</div>
        <input type="text" class="input" id="title" value="西湖云舍民宿 · 湖景真的很治愈">
    </div>

    <div class="field">
        <div class="field-label">评分 （0 - 5 星）</div>
        <select class="input" id="score">
        <option selected>5 分 ★★★★★</option>
        <option>4 分 ★★★★☆</option>
        <option>3 分 ★★★☆☆</option>
        <option>2 分 ★★☆☆☆</option>
        <option>1 分 ★☆☆☆☆</option>
    </select>
    </div>

    <div class="field">
        <div class="field-label">正文内容</div>
        <textarea class="input" id="content">房间落地窗正对西湖，早上拉开窗帘就能看到湖面和远处山的轮廓，真的非常治愈。
老板人很好，帮忙预定了第二天一早的船票。早餐是现磨豆浆和简单中式早点，虽然不豪华但很干净。
就是周末价格略贵，建议工作日来会更划算。</textarea>
    </div>

    <div class="btn-row">
        <div class="btn btn-save" onclick="saveEdit()">保存修改</div>
        <div class="btn btn-cancel" onclick="history.back()">取消</div>
    </div>

</div>

    </div>
</div>

<script>
function saveEdit(){
    let title = document.getElementById("title");
    let content = document.getElementById("content");
    if(!title.value.trim() || !content.value.trim()){
        alert("标题和正文不能为空！");
        return;
    }
    alert("评论修改已保存！（演示效果）");
    location.href="displayPost.html";
}
</script>

</body>
</html>
