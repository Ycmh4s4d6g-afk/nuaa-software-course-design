<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统通知中心 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:12px;
}

/* 通知卡片 */
    .note{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    border-left:4px solid #2563eb;
    box-sizing:border-box;
    cursor:pointer;
    }
.note.read{
    opacity:0.6;
    border-left-color:#94a3b8;
    }
.note-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
    }
.note-time{
    font-size:11px;
    color:#6b7280;
    font-weight:500;
}
.note-content{
    font-size:13px;
    color:#374151;
    margin-bottom:8px;
}
.btn-see{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    通知中心
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">我的通知</div>
    <div class="sub-text">查看订单进度、评论提示、退款处理状态等系统消息</div>

    <div class="note" onclick="markRead(this)">
        <div class="note-head">
            <span>订单已预订成功</span>
            <span class="note-time">2025-01-14 10:22</span>
        </div>
        <div class="note-content">你在「杭州西湖云舍民宿」的预订已确认 ✔</div>
        <button class="btn-see" onclick="event.stopPropagation();location.href='reservationDetail.html'">查看订单</button>
    </div>

    <div class="note" onclick="markRead(this)">
        <div class="note-head">
            <span>新的评论回复提醒</span>
            <span class="note-time">2025-02-03 14:11</span>
        </div>
        <div class="note-content">你发布的评论贴有 2 条新回复 🔥</div>
        <button class="btn-see" onclick="event.stopPropagation();location.href='displayPost.html'">查看评论</button>
    </div>

    <div class="note read">
        <div class="note-head">
            <span>预订已取消</span>
            <span class="note-time">2025-02-01 09:05</span>
        </div>
        <div class="note-content">你取消了「上海外滩星程酒店」的订单</div>
        <button class="btn-see" onclick="event.stopPropagation();location.href='reservationDetail.html'">查看记录</button>
    </div>

</div>

    </div>
</div>

<script>
function markRead(box){
    box.classList.add("read");
}
</script>

</body>
</html>
