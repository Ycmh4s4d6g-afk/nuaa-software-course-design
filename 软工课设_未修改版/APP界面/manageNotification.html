<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通知管理后台 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}

    header{
        background:linear-gradient(120deg,#2563eb,#1e40af);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 4px 14px rgba(0,0,0,.22);
    }
    header a{color:white;text-decoration:none;margin-left:18px;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{max-width:1000px;margin:42px auto;padding:0 26px;}
    .title{font-size:24px;font-weight:700;margin-bottom:6px;}
    .sub{font-size:13px;color:#64748b;margin-bottom:26px;}

    table{
        width:100%;background:white;border-collapse:collapse;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
        border-radius:16px;overflow:hidden;
    }
    th,td{
        padding:14px;text-align:center;font-size:14px;
        border-bottom:1px solid #e5e7eb;
    }
    th{
        background:#eff6ff;color:#1e3a8a;font-weight:700;
    }

    .read{opacity:.55;}

    button{
        padding:6px 14px;border:none;border-radius:6px;
        font-size:13px;font-weight:600;cursor:pointer;margin:2px;
        transition:.2s;
    }
    .look{background:#2563eb;color:white;}
    .look:hover{filter:brightness(1.08);}
    .mark{background:#22c55e;color:white;}
    .mark:hover{filter:brightness(1.08);}
    .del{background:#dc2626;color:white;}
    .del:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">🛠 系统通知后台管理</div>
    <nav>
        <a href="adminIndex.html">管理员首页</a>
        <a href="index.html">系统首页</a>
    </nav>
</header>

<div class="page">

    <div class="title">通知记录列表</div>
    <div class="sub">对平台全部通知进行查看、标记、删除管理</div>

    <table id="notifyTable">

        <tr>
            <th>用户名</th>
            <th>通知内容</th>
            <th>时间</th>
            <th>来源模块</th>
            <th>操作</th>
        </tr>

        <!-- 记录1 未读 -->
        <tr>
            <td>小陈</td>
            <td>预订已成功 ✔ 杭州西湖云舍民宿</td>
            <td>2025-01-14</td>
            <td>订单 Reservation</td>
            <td>
                <button class="look" onclick="toOrder()">查看订单</button>
                <button class="mark" onclick="markRead(this)">标记已读</button>
                <button class="del" onclick="removeRow(this)">删除</button>
            </td>
        </tr>

        <!-- 记录2 未读 -->
        <tr>
            <td>Alice</td>
            <td>你的评论有新回复 🔥</td>
            <td>2025-02-03</td>
            <td>评论 Post</td>
            <td>
                <button class="look" onclick="toPost()">查看评论</button>
                <button class="mark" onclick="markRead(this)">已读</button>
                <button class="del" onclick="removeRow(this)">删除</button>
            </td>
        </tr>

        <!-- 记录3 已读 -->
        <tr class="read">
            <td>李亮</td>
            <td>预订已取消（上海外滩星程酒店）</td>
            <td>2025-02-01</td>
            <td>订单 Reservation</td>
            <td>
                <button class="look" onclick="toOrder()">查看订单</button>
                <button class="del" onclick="removeRow(this)">删除</button>
            </td>
        </tr>

    </table>
</div>

<script>
function markRead(btn){
    btn.parentNode.parentNode.classList.add("read");
    btn.remove();
}
function removeRow(btn){
    btn.parentNode.parentNode.remove();
}
function toOrder(){
    location.href="reservationDetail.html";
}
function toPost(){
    location.href="displayPost.html";
}
</script>

</body>
</html>
