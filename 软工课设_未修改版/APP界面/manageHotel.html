<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>酒店管理后台 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:12px;
}

/* 按钮 */
.btn-add{
    width:100%;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    background:#22c55e;
    color:#fff;
    font-size:14px;
    cursor:pointer;
    border:none;
    margin-bottom:12px;
    }

/* 酒店卡片 */
.hotel-card{
    background:#f9fafb;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    box-sizing:border-box;
}
.hotel-img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
}
.hotel-info{
    padding:12px;
}
.hotel-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
}
.hotel-meta{
    font-size:12px;
    color:#6b7280;
    margin-bottom:6px;
}
.hotel-price{
    font-weight:700;
    color:#2563eb;
    font-size:14px;
    margin-bottom:10px;
}
.hotel-actions{
    display:flex;
    gap:8px;
    }
    .btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    border:none;
    }
.btn-edit{
    background:#2563eb;
    color:#fff;
}
.btn-del{
    background:#dc2626;
    color:#fff;
    }
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='adminIndex.html'">←</span>
    酒店管理
    <span class="logo">酒店预订系统</span>
    </div>

<div class="main">
    <div class="section-title">酒店信息管理</div>
    <div class="sub-text">管理员可对酒店进行添加 / 修改 / 删除操作</div>

    <div class="btn-add" onclick="location.href='addHotel.html'">+ 新增酒店</div>

    <div class="hotel-card">
        <img src="杭州西湖.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">杭州西湖云舍民宿</div>
            <div class="hotel-meta">西湖景区核心 · 评分4.7</div>
            <div class="hotel-price">￥520 / 晚</div>
            <div class="hotel-actions">
                <div class="btn btn-edit" onclick="location.href='editHotel.html'">编辑</div>
                <div class="btn btn-del" onclick="location.href='deleteHotel.html'">删除</div>
            </div>
        </div>
            </div>

    <div class="hotel-card">
        <img src="上海外滩.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">上海外滩星程酒店</div>
            <div class="hotel-meta">黄浦区中心地带 · 评分4.6</div>
            <div class="hotel-price">￥598 / 晚</div>
            <div class="hotel-actions">
                <div class="btn btn-edit" onclick="location.href='editHotel.html'">编辑</div>
                <div class="btn btn-del" onclick="location.href='deleteHotel.html'">删除</div>
            </div>
        </div>
            </div>

    <div class="hotel-card">
        <img src="紫峰大厦.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">南京紫峰大厦精选酒店</div>
            <div class="hotel-meta">玄武区商业中心 · 评分4.8</div>
            <div class="hotel-price">￥488 / 晚</div>
            <div class="hotel-actions">
                <div class="btn btn-edit" onclick="location.href='editHotel.html'">编辑</div>
                <div class="btn btn-del" onclick="location.href='deleteHotel.html'">删除</div>
            </div>
        </div>
    </div>

        </div>

    </div>
</div>

</body>
</html>
