<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的收藏 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:12px;
}

/* 收藏卡片 */
.collect-card{
    background:#f9fafb;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    box-sizing:border-box;
}
.collect-img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
}
.collect-info{
    padding:12px;
}
.collect-name{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
}
.collect-meta{
    font-size:12px;
    color:#71717a;
    margin-bottom:6px;
}
.collect-price{
    font-size:15px;
    font-weight:700;
    color:#d97706;
    margin-bottom:10px;
}
.collect-actions{
    display:flex;
    gap:8px;
}
.btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    border:none;
    }
.btn-detail{
    background:#d97706;
    color:#fff;
}
.btn-cancel{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    我的收藏
    <span class="logo">酒店预订系统</span>
            </div>

<div class="main">
    <div class="section-title">已收藏酒店</div>
    <div class="sub-text">你可以取消收藏或进入酒店页面继续预订</div>

    <div class="collect-card">
        <img src="杭州西湖.jpg" class="collect-img">
        <div class="collect-info">
            <div class="collect-name">杭州西湖云舍民宿</div>
            <div class="collect-meta">评分 4.7 · 景观房</div>
            <div class="collect-price">￥520 / 晚</div>
            <div class="collect-actions">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-cancel" onclick="cancel(this)">取消收藏</div>
            </div>
        </div>
            </div>

    <div class="collect-card">
        <img src="上海外滩.jpg" class="collect-img">
        <div class="collect-info">
            <div class="collect-name">上海外滩星程酒店</div>
            <div class="collect-meta">评分 4.6 · 交通便利</div>
            <div class="collect-price">￥598 / 晚</div>
            <div class="collect-actions">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-cancel" onclick="cancel(this)">取消收藏</div>
            </div>
        </div>
            </div>

    <div class="collect-card">
        <img src="紫峰大厦.jpg" class="collect-img">
        <div class="collect-info">
            <div class="collect-name">南京紫峰大厦精选酒店</div>
            <div class="collect-meta">评分 4.8 · 夜景绝佳</div>
            <div class="collect-price">￥488 / 晚</div>
            <div class="collect-actions">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-cancel" onclick="cancel(this)">取消收藏</div>
            </div>
        </div>
    </div>

        </div>

    </div>
</div>

<script>
function cancel(btn){
    btn.closest('.collect-card').remove();
    alert("收藏已取消（演示）");
}
</script>

</body>
</html>
