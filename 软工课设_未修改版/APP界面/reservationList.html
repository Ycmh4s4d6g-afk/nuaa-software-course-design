<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的预订 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:12px;
}

/* 订单卡片 */
.order-card{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    box-sizing:border-box;
}
.order-header{
    display:flex;
    gap:12px;
    margin-bottom:10px;
    }
.order-img{
    width:100px;
    height:70px;
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
    }
.order-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.order-info{
    flex:1;
}
.hotel-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
}
.order-meta{
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}
.order-price{
    color:#2563eb;
    font-weight:700;
    font-size:14px;
}
.order-status{
    font-size:12px;
    font-weight:600;
    margin-top:4px;
}
.status-completed{
    color:#22c55e;
}
.status-pending{
    color:#dc2626;
}
.status-booked{
    color:#2563eb;
}

/* 操作按钮 */
.order-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    }
.btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    border:none;
    }
.btn-detail{
    background:#2563eb;
    color:#fff;
}
.btn-modify{
    background:#22c55e;
    color:#fff;
}
.btn-cancel{
    background:#dc2626;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    我的预订
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">历史预订订单</div>
    <div class="sub-text">可查看详情、修改订单或取消预订</div>

    <div class="order-card">
        <div class="order-header">
            <div class="order-img"><img src="杭州西湖.jpg"></div>
            <div class="order-info">
            <div class="hotel-name">杭州西湖云舍民宿</div>
                <div class="order-meta">入住：2025-01-12 · 离店：2025-01-14</div>
                <div class="order-price">¥ 1040</div>
                <div class="order-status status-completed">✔ 已完成</div>
            </div>
        </div>
        <div class="order-actions">
            <div class="btn btn-detail" onclick="location.href='reservationDetail.html'">查看详情</div>
            <div class="btn btn-modify" onclick="location.href='editReservation.html'">修改订单</div>
        </div>
    </div>

    <div class="order-card">
        <div class="order-header">
            <div class="order-img"><img src="上海外滩.jpg"></div>
            <div class="order-info">
            <div class="hotel-name">上海外滩星程酒店</div>
                <div class="order-meta">入住：2025-02-03 · 离店：2025-02-06</div>
                <div class="order-price">¥ 1794</div>
                <div class="order-status status-pending">⏳ 待付款</div>
            </div>
        </div>
        <div class="order-actions">
            <div class="btn btn-detail" onclick="location.href='reservationDetail.html'">查看详情</div>
            <div class="btn btn-cancel" onclick="alert('预订取消成功（演示）')">取消订单</div>
        </div>
    </div>

    <div class="order-card">
        <div class="order-header">
            <div class="order-img"><img src="紫峰大厦.jpg"></div>
            <div class="order-info">
            <div class="hotel-name">南京紫峰大厦精选酒店</div>
                <div class="order-meta">入住：2025-03-18 · 离店：2025-03-20</div>
                <div class="order-price">¥ 976</div>
                <div class="order-status status-booked">🕓 已预订</div>
            </div>
        </div>
        <div class="order-actions">
            <div class="btn btn-detail" onclick="location.href='reservationDetail.html'">查看详情</div>
            <div class="btn btn-modify" onclick="location.href='editReservation.html'">修改订单</div>
            <div class="btn btn-cancel" onclick="alert('预订已取消（演示）')">取消订单</div>
        </div>
    </div>

</div>

    </div>
</div>

</body>
</html>
