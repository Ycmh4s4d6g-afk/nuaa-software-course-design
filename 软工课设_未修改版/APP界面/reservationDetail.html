<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单详情 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
    }
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 12px;
}

    /* 信息卡片 */
    .card{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    box-sizing:border-box;
}

/* 酒店信息 */
    .hotel-img{
    width:100%;
    height:160px;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:10px;
    }
    .hotel-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    }
.hotel-name{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
}
.hotel-meta{
    font-size:12px;
    color:#64748b;
    margin-bottom:6px;
}
.hotel-price{
    color:#2563eb;
    font-weight:700;
    font-size:15px;
}

/* 订单信息行 */
.info-line{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
}
.info-key{
    color:#6b7280;
}
.info-value{
    color:#374151;
    font-weight:500;
}

/* 状态 */
    .status{
    font-size:14px;
    font-weight:700;
    margin-top:8px;
        color:#22c55e;
    }

/* 按钮 */
.btn-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    }
.btn{
    flex:1;
    text-align:center;
    padding:10px 0;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    border:none;
    }
.btn-edit{
    background:#2563eb;
    color:#fff;
}
.btn-cancel{
    background:#dc2626;
    color:#fff;
}
.btn-back{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='reservationList.html'">←</span>
    订单详情
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">🏨 酒店信息</div>
    <div class="card">
            <div class="hotel-img"><img src="杭州西湖.jpg"></div>
                <div class="hotel-name">杭州西湖云舍民宿</div>
                <div class="hotel-meta">📍 浙江省杭州市西湖区 · 湖景民宿 · 高评分4.7</div>
        <div class="hotel-price">￥520 / 每晚</div>
    </div>

    <div class="section-title">📅 订单详情信息</div>
    <div class="card">
        <div class="info-line">
            <span class="info-key">订单编号</span>
            <span class="info-value">NO.202501120001</span>
        </div>
        <div class="info-line">
            <span class="info-key">入住时间</span>
            <span class="info-value">2025-01-12 14:00</span>
        </div>
        <div class="info-line">
            <span class="info-key">离店时间</span>
            <span class="info-value">2025-01-14 12:00</span>
        </div>
        <div class="info-line">
            <span class="info-key">入住天数</span>
            <span class="info-value">2 晚</span>
        </div>
        <div class="info-line">
            <span class="info-key">入住人数</span>
            <span class="info-value">2 位住客</span>
        </div>
        <div class="info-line">
            <span class="info-key">订单金额</span>
            <span class="info-value">¥1040</span>
        </div>
        <div class="status">✔ 状态：已完成</div>

        <div class="btn-row">
            <div class="btn btn-edit" onclick="location.href='editReservation.html'">修改预订</div>
            <div class="btn btn-cancel" onclick="alert('订单取消成功（演示）')">取消订单</div>
        </div>
        <div class="btn-row">
            <div class="btn btn-back" onclick="location.href='reservationList.html'">返回列表</div>
        </div>
    </div>

</div>

    </div>
</div>

</body>
</html>
