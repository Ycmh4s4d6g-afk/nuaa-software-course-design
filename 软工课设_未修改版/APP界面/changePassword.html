<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修改密码 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    }

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:600;
    margin:20px 0 8px;
    text-align:center;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:24px;
    text-align:center;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:14px;
    box-sizing:border-box;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
    }
    .btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    }
.btn-save{
    background:#2563eb;
    color:#fff;
}
.btn-cancel{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    修改密码
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">设置新密码</div>
    <div class="sub-text">请设置一个安全的新密码</div>

    <div class="field">
        <div class="field-label">新密码</div>
        <input type="password" class="input" placeholder="请输入新密码">
    </div>

    <div class="field">
        <div class="field-label">确认新密码</div>
        <input type="password" class="input" placeholder="请再次输入新密码">
    </div>

    <div class="btn-row">
        <div class="btn btn-save" onclick="save()">保存密码</div>
        <div class="btn btn-cancel" onclick="location.href='signin.html'">取消</div>
    </div>

</div>

    </div>
</div>

<script>
function save(){
    alert("密码修改成功！（演示）");
    location.href="signin.html";
}
</script>

</body>
</html>
