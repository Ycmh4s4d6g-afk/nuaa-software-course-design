<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>删除评论贴 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:700;
    color:#dc2626;
    margin:20px 0 8px;
    text-align:center;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:20px;
    text-align:center;
}

/* 警告框 */
.warn{
    background:#fee2e2;
    border-left:4px solid #dc2626;
    padding:12px;
    border-radius:8px;
    margin-bottom:16px;
    color:#7f1d1d;
    font-size:13px;
    line-height:1.6;
}

/* 信息展示 */
.info{
    background:#fef3c7;
    border-radius:8px;
    padding:12px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.7;
    color:#78350f;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:13px;
    box-sizing:border-box;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
}
.btn-danger{
    background:#dc2626;
    color:#fff;
}
.btn-back{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='listPost.html'">←</span>
    删除评论
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">确认进行删除？</div>
    <div class="sub-text">该操作无法恢复，请务必确认！</div>

    <div class="warn">
        你正在尝试永久删除这条评论，包括评论标题、正文内容、评分和所有相关信息。删除后将立即从系统中消失，其他用户将无法继续查看该评论。
    </div>

    <div class="info">
        📝 <b>评论标题：</b>西湖云舍民宿 · 湖景真的很治愈<br>
        🏨 <b>关联酒店：</b>杭州西湖云舍民宿<br>
        ⭐ <b>评分：</b>5 分 ★★★★★<br>
        📅 <b>发布时间：</b>2025-01-15
    </div>

    <div class="field">
        <div class="field-label">为确认删除，请输入评论标题：</div>
        <input type="text" class="input" id="check" placeholder="请输入：西湖云舍民宿 · 湖景真的很治愈">
    </div>

    <div class="btn-row">
        <div class="btn btn-danger" onclick="delPost()">确认删除</div>
        <div class="btn btn-back" onclick="location.href='listPost.html'">取消并返回</div>
    </div>

</div>

    </div>
</div>

<script>
function delPost(){
    let checkInput = document.getElementById("check");
    if(checkInput.value !== "西湖云舍民宿 · 湖景真的很治愈"){
        alert("评论标题输入不一致，删除终止！");
        return;
    }
    if(confirm("⚠ 确定要删除这条评论吗？此操作无法撤销！")){
        alert("评论已成功删除！（演示）");
        location.href="listPost.html";
    }
}
</script>

</body>
</html>
