<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创建预订订单 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    }

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 12px;
}

/* 酒店信息展示 */
.hotel-bar{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:16px;
}
    .hotel-img{
    width:100%;
    height:140px;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:10px;
    }
.hotel-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.hotel-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
}
.hotel-meta{
    font-size:12px;
    color:#6b7280;
    margin-bottom:6px;
}
.hotel-price{
    font-size:16px;
    color:#2563eb;
    font-weight:700;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input, select{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:14px;
    box-sizing:border-box;
    }

    /* 价格展示 */
    .total-box{
    background:#eef6ff;
    border-left:4px solid #3b82f6;
    padding:14px;
    border-radius:8px;
    margin-top:16px;
    font-size:15px;
    font-weight:700;
    color:#1d4ed8;
    }

    /* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    }
.btn-submit{
    background:#22c55e;
    color:#fff;
}
.btn-back{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="history.back()">←</span>
    创建预订
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">🏨 酒店信息确认</div>

        <div class="hotel-bar">
            <div class="hotel-img">
                <img src="杭州西湖.jpg">
            </div>
                <div class="hotel-name">杭州西湖云舍民宿</div>
                <div class="hotel-meta">浙江省杭州市 · 景观房 · 评分 4.7</div>
        <div class="hotel-price">￥520 / 晚</div>
        </div>

        <div class="field">
        <div class="field-label">入住日期</div>
        <input type="date" class="input" id="inDate" onchange="calc()">
        </div>

        <div class="field">
        <div class="field-label">离店日期</div>
        <input type="date" class="input" id="outDate" onchange="calc()">
        </div>

        <div class="field">
        <div class="field-label">入住人数</div>
        <select class="input" id="people">
                <option>1 位</option>
                <option selected>2 位</option>
                <option>3 位</option>
                <option>4 位</option>
            </select>
        </div>

        <div class="total-box" id="totalPrice">
            请选择日期以计算费用
        </div>

    <div class="btn-row">
        <div class="btn btn-submit" onclick="submitOrder()">提交预订</div>
        <div class="btn btn-back" onclick="history.back()">返回</div>
    </div>

        </div>

    </div>
</div>

<script>
function calc(){
    let pricePerNight = 520;
    let inDate = new Date(document.getElementById("inDate").value);
    let outDate = new Date(document.getElementById("outDate").value);
    if(!document.getElementById("inDate").value || !document.getElementById("outDate").value) return;

    let nights = Math.ceil((outDate - inDate) / 86400000);
    if(nights <= 0){
        document.getElementById("totalPrice").innerHTML="⚠ 离店日期需大于入住日期!";
        return;
    }
    document.getElementById("totalPrice").innerHTML=`预计消费：¥ ${nights * pricePerNight}（共 ${nights} 晚）`;
}

function submitOrder(){
    alert("订单提交成功！（演示）");
    location.href="reservationList.html";
}
</script>

</body>
</html>
