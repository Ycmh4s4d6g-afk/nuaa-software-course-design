<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理员后台首页 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
    body{
        margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
    }
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
    }
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
    }

/* 管理卡片 */
    .card{
    background:#f9fafb;
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
    box-sizing:border-box;
    cursor:pointer;
        text-align:center;
    }
.card-icon{
    font-size:36px;
    margin-bottom:8px;
    }
.card-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
}
.card-desc{
    font-size:12px;
    color:#6b7280;
    line-height:1.5;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='index.html'">←</span>
    管理后台
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">管理功能</div>

    <div class="card" onclick="location.href='manageUser.html'">
        <div class="card-icon">👤</div>
        <div class="card-title">用户管理</div>
        <div class="card-desc">查看用户账号、修改资料、删除异常用户</div>
    </div>

    <div class="card" onclick="location.href='manageHotel.html'">
        <div class="card-icon">🏩</div>
        <div class="card-title">酒店管理</div>
        <div class="card-desc">新增酒店、信息修改、下架与维护</div>
    </div>

    <div class="card" onclick="location.href='manageReservation.html'">
        <div class="card-icon">📑</div>
        <div class="card-title">订单/预订管理</div>
        <div class="card-desc">审核预订、查看订单记录、操作订单状态</div>
    </div>

    <div class="card" onclick="location.href='managePost.html'">
        <div class="card-icon">📝</div>
        <div class="card-title">评论审核</div>
        <div class="card-desc">管理酒店评价、删除违规评论、审核贴文</div>
    </div>

    <div class="card" onclick="location.href='managePayment.html'">
        <div class="card-icon">💰</div>
        <div class="card-title">支付记录</div>
        <div class="card-desc">查看用户订单支付流水、退款审核</div>
    </div>

    <div class="card" onclick="location.href='manageNotification.html'">
        <div class="card-icon">🔔</div>
        <div class="card-title">通知中心</div>
        <div class="card-desc">系统告知、退款提醒、审核处理消息</div>
    </div>

</div>

    </div>
</div>

</body>
</html>
