<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>酒店列表 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:12px;
}

/* 酒店卡片 */
.hotel-card{
    background:#f9fafb;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    box-sizing:border-box;
}
.hotel-img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    }
.hotel-info{
    padding:12px;
}
.hotel-name{
    font-size:15px;
    font-weight:600;
    margin-bottom:4px;
}
.hotel-meta{
    font-size:12px;
    color:#6b7280;
    margin-bottom:6px;
}
.hotel-price{
    font-size:14px;
    color:#2563eb;
    font-weight:600;
    margin-bottom:8px;
}
.hotel-rate{
    color:#f97316;
    font-weight:600;
    font-size:13px;
}
    .btn-area{
    display:flex;
    gap:8px;
    margin-top:8px;
    }
    .btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    border:none;
    }
.btn-detail{
    background:#2563eb;
    color:#fff;
}
.btn-book{
    background:#22c55e;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    酒店列表
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">热门酒店推荐</div>
    <div class="sub-text">为你精选品质住宿，支持在线预订与收藏</div>

    <div class="hotel-card">
        <img src="杭州西湖.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">杭州西湖云舍民宿</div>
            <div class="hotel-meta">杭州市 · 临湖观景 · 休闲推荐</div>
                <div>
                <span class="hotel-rate">⭐ 4.7</span> | <span class="hotel-price">￥520 起/晚</span>
            </div>
            <div class="btn-area">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-book" onclick="location.href='createReservation.html'">立即预订</div>
            </div>
            </div>
        </div>

    <div class="hotel-card">
        <img src="上海外滩.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">上海外滩星程酒店</div>
            <div class="hotel-meta">外滩 · 黄浦区中心 · 商旅首选</div>
                <div>
                <span class="hotel-rate">⭐ 4.6</span> | <span class="hotel-price">￥598 起/晚</span>
            </div>
            <div class="btn-area">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-book" onclick="location.href='createReservation.html'">立即预订</div>
            </div>
            </div>
        </div>

    <div class="hotel-card">
        <img src="紫峰大厦.jpg" class="hotel-img">
        <div class="hotel-info">
            <div class="hotel-name">南京紫峰大厦精选酒店</div>
            <div class="hotel-meta">玄武区核心 · 地标视野 · 交通便利</div>
                <div>
                <span class="hotel-rate">⭐ 4.8</span> | <span class="hotel-price">￥488 起/晚</span>
            </div>
            <div class="btn-area">
                <div class="btn btn-detail" onclick="location.href='hotelDetail.html'">查看详情</div>
                <div class="btn btn-book" onclick="location.href='createReservation.html'">立即预订</div>
            </div>
        </div>
    </div>

        </div>

    </div>
</div>

</body>
</html>
