<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理员登录 - 酒店预订系统后台</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
    body{
        margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
        display:flex;
        justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
        align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
    }
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:600;
    margin:20px 0 24px;
    text-align:center;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:14px;
    box-sizing:border-box;
}

/* 切换按钮 */
    .switch{
        display:flex;
        border-radius:10px;
        overflow:hidden;
    margin-bottom:20px;
        border:1px solid #d1d5db;
    }
.switch-item{
    flex:1;
    padding:10px 0;
    text-align:center;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
    background:#e5e7eb;
    color:#374151;
    }
.switch-item.active{
    background:#2563eb;
    color:white;
    }

/* 按钮 */
.btn-primary{
    width:100%;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:15px;
    cursor:pointer;
    border:none;
    background:#2563eb;
    color:#fff;
    font-weight:600;
    margin-top:10px;
}

/* 返回链接 */
.back-link{
    display:block;
    text-align:center;
    margin-top:16px;
    color:#2563eb;
    font-size:13px;
    text-decoration:none;
    }
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='index.html'">←</span>
    管理员登录
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">管理员后台登录</div>

    <!-- 登录方式切换按钮 -->
    <div class="switch">
        <div id="btnPwd" class="switch-item active" onclick="switchToPwd()">账号密码</div>
        <div id="btnSMS" class="switch-item" onclick="switchToSMS()">验证码登录</div>
    </div>

    <!-- 账号密码登录 -->
    <div id="pwdArea">
        <div class="field">
            <div class="field-label">管理员邮箱 / 手机号</div>
            <input type="text" class="input" id="adminAccount" placeholder="请输入账号">
        </div>
        <div class="field">
            <div class="field-label">登录密码</div>
            <input type="password" class="input" id="adminPwd" placeholder="请输入密码">
        </div>
        <div class="btn-primary" onclick="loginPwd()">登录后台</div>
    </div>

    <!-- 验证码登录 -->
    <div id="smsArea" style="display:none;">
        <div class="field">
            <div class="field-label">手机号</div>
            <input type="text" class="input" id="adminPhone" placeholder="请输入手机号">
        </div>
        <div class="field">
            <div class="field-label">验证码</div>
            <input type="text" class="input" id="code" placeholder="请输入验证码">
        </div>
        <div class="btn-primary" onclick="loginSMS()">登录后台</div>
    </div>

    <a href="index.html" class="back-link">← 返回系统首页</a>

</div>

    </div>
</div>

<script>
// 切换逻辑
function switchToPwd(){
    document.getElementById("smsArea").style.display="none";
    document.getElementById("pwdArea").style.display="block";
    document.getElementById("btnPwd").classList.add("active");
    document.getElementById("btnSMS").classList.remove("active");
}
function switchToSMS(){
    document.getElementById("pwdArea").style.display="none";
    document.getElementById("smsArea").style.display="block";
    document.getElementById("btnSMS").classList.add("active");
    document.getElementById("btnPwd").classList.remove("active");
}

// 登录行为模拟
function loginPwd(){
    let account = document.getElementById("adminAccount").value.trim();
    let pwd = document.getElementById("adminPwd").value.trim();
    if(!account || !pwd){
        alert("请输入完整信息！");
        return;
    }
    alert("登录成功！（演示）");
    location.href="adminIndex.html";
}
function loginSMS(){
    let phone = document.getElementById("adminPhone").value.trim();
    let code = document.getElementById("code").value.trim();
    if(!phone || !code){
        alert("请输入手机号与验证码！");
        return;
    }
    alert("登录成功！（演示）");
    location.href="adminIndex.html";
}
</script>

</body>
</html>
