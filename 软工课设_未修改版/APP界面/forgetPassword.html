<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>找回密码 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    }

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:600;
    margin:20px 0 8px;
    text-align:center;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:24px;
    text-align:center;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:14px;
    box-sizing:border-box;
    }

/* 验证码区域 */
    .verify-box{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}
.verify-input{
    flex:1;
    }
    .verify-btn{
    flex:0 0 100px;
    text-align:center;
    padding:12px 0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:12px;
    cursor:pointer;
    border:none;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}
    .btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    }
.btn-reset{
    background:#22c55e;
    color:#fff;
}
.btn-back{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='signin.html'">←</span>
    找回密码
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">忘记密码？</div>
    <div class="sub-text">输入手机号获取验证码并重设密码</div>

    <div class="field">
        <div class="field-label">手机号</div>
        <input type="text" class="input" id="phone" placeholder="请输入注册手机号">
    </div>

    <div class="verify-box">
        <input type="text" class="input verify-input" id="code" placeholder="验证码">
        <div class="verify-btn" onclick="sendCode()">获取验证码</div>
    </div>

    <div class="btn-row">
        <div class="btn btn-reset" onclick="resetPwd()">提交验证并重置密码</div>
        <div class="btn btn-back" onclick="location.href='signin.html'">返回登录</div>
    </div>

</div>

    </div>
</div>

<script>
function sendCode(){
    alert("验证码已发送！（演示）");
}
function resetPwd(){
    let phone = document.getElementById('phone').value;
    let code = document.getElementById('code').value;
    if(!phone || !code){
        alert("请填写手机号与验证码！");
        return;
    }
    alert("验证通过！即将跳转至设置新密码界面");
    location.href="changePassword.html";
}
</script>

</body>
</html>
