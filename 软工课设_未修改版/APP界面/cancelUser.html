<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注销账户 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:18px;
    font-weight:700;
    color:#dc2626;
    margin:20px 0 8px;
    text-align:center;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:20px;
    text-align:center;
}

/* 警告框 */
.warn{
    background:#fee2e2;
    color:#991b1b;
    font-size:13px;
    padding:12px;
    border-radius:8px;
    border-left:4px solid #dc2626;
    margin-bottom:16px;
    line-height:1.6;
}

/* 表单控件 */
.field{
    margin-bottom:16px;
}
.field-label{
    font-size:13px;
    margin-bottom:6px;
    color:#4b5563;
}
.input{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 12px;
    font-size:13px;
    box-sizing:border-box;
}

/* 按钮 */
.btn{
    width:100%;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    margin-top:10px;
}
.btn-danger{
    background:#dc2626;
    color:#fff;
}
.btn-cancel{
    background:#6b7280;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='getUserInfo.html'">←</span>
    注销账户
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">确认删除账户？</div>
    <div class="sub-text">注销后所有信息将无法恢复，请谨慎操作！</div>

    <div class="warn">
        删除账号后所有预订、收藏、评论、支付记录将被清除且不可找回。若你仍然希望继续操作，请输入现密码进行验证。
    </div>

    <div class="field">
        <div class="field-label">输入登录密码以验证身份</div>
        <input type="password" class="input" id="pwd" placeholder="请输入密码进行确认">
    </div>

    <div class="btn btn-danger" onclick="del()">确认注销账户</div>
    <div class="btn btn-cancel" onclick="location.href='getUserInfo.html'">取消并返回</div>

</div>

    </div>
</div>

<script>
function del(){
    let pwd = document.getElementById("pwd").value;
    if(!pwd){
        alert("请输入密码再继续");
        return;
    }
    if(confirm("⚠ 确定要注销账户吗？此操作无法撤销，所有数据将被永久删除！")){
        alert("账户已注销！（演示）将返回首页");
        location.href="index.html";
    }
}
</script>

</body>
</html>
