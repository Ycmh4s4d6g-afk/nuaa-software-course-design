<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人信息 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    }

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 12px;
    text-align:center;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
    margin-bottom:20px;
    text-align:center;
}

/* 信息行 */
    .info-line{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
        border-bottom:1px solid #e5e7eb;
    font-size:14px;
    }
.info-label{
    color:#475569;
}
.info-value{
    font-weight:500;
    color:#374151;
}

/* 按钮 */
    .btn{
    width:100%;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    margin-top:10px;
    }
.btn-edit{
    background:#2563eb;
    color:#fff;
}
.btn-password{
    background:#0ea5e9;
    color:#fff;
}
.btn-cancel{
    background:#ef4444;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    个人信息
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">当前账户信息</div>
    <div class="sub-text">以下为您的个人账号资料，可进行修改或安全设置</div>

    <div class="info-line">
        <div class="info-label">手机号 / 用户名</div>
        <div class="info-value">138****XXXX</div>
    </div>

    <div class="info-line">
        <div class="info-label">账户类型</div>
        <div class="info-value">普通用户</div>
    </div>

    <div class="info-line">
        <div class="info-label">会员等级</div>
        <div class="info-value">LV1 新用户</div>
    </div>

    <div class="info-line">
        <div class="info-label">注册时间</div>
        <div class="info-value">2025-xx-xx</div>
    </div>

    <div class="info-line">
        <div class="info-label">累计预订数</div>
        <div class="info-value">3 次</div>
    </div>

    <div class="btn btn-edit" onclick="location.href='changeUserInfo.html'">✏ 修改个人信息</div>
    <div class="btn btn-password" onclick="location.href='changePassword.html'">🔐 修改密码</div>
    <div class="btn btn-cancel" onclick="location.href='cancelUser.html'">⚠ 注销账号</div>

</div>

    </div>
</div>

</body>
</html>
