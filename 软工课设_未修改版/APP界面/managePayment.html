<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>支付记录管理 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}

/* 支付记录卡片 */
.payment-card{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    box-sizing:border-box;
}
.payment-id{
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}
.payment-user{
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
}
.payment-hotel{
    font-size:13px;
    color:#6b7280;
    margin-bottom:4px;
}
.payment-amount{
    font-size:15px;
    color:#2563eb;
    font-weight:700;
    margin-bottom:6px;
}
.payment-status{
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
}
.status-paid{
    color:#059669;
}
.status-refunding{
    color:#f59e0b;
}
.status-refunded{
    color:#6b7280;
}
.payment-actions{
    display:flex;
    gap:8px;
}
.btn{
    flex:1;
    text-align:center;
    padding:6px 0;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    border:none;
}
.btn-view{
    background:#2563eb;
    color:#fff;
}
.btn-refund{
    background:#dc2626;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='adminIndex.html'">←</span>
    支付管理
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">支付记录后台管理</div>

    <div class="payment-card">
        <div class="payment-id">支付单号: 20250220101</div>
        <div class="payment-user">用户名: </div>
        <div class="payment-hotel">酒店: 杭州西湖云舍</div>
        <div class="payment-amount">金额: ¥1040</div>
        <div class="payment-status status-paid">状态: 已支付</div>
        <div class="payment-actions">
            <div class="btn btn-view" onclick="location.href='reservationDetail.html'">查看订单</div>
            <div class="btn btn-refund" onclick="location.href='refundApply.html'">发起退款</div>
        </div>
    </div>

    <div class="payment-card">
        <div class="payment-id">支付单号: 20250115088</div>
        <div class="payment-user">用户名: Alice</div>
        <div class="payment-hotel">酒店: 上海外滩星程</div>
        <div class="payment-amount">金额: ¥980</div>
        <div class="payment-status status-refunding">状态: 退款处理中</div>
        <div class="payment-actions">
            <div class="btn btn-view" onclick="location.href='reservationDetail.html'">查看订单</div>
        </div>
    </div>

    <div class="payment-card">
        <div class="payment-id">支付单号: 20241231045</div>
        <div class="payment-user">用户名: 李亮</div>
        <div class="payment-hotel">酒店: 南京紫峰大厦</div>
        <div class="payment-amount">金额: ¥820</div>
        <div class="payment-status status-refunded">状态: 已退款</div>
        <div class="payment-actions">
            <div class="btn btn-view" onclick="location.href='reservationDetail.html'">查看订单</div>
        </div>
    </div>

</div>

    </div>
</div>

</body>
</html>
