<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>支付成功 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* 成功图标 */
.success-icon{
    font-size:64px;
    color:#059669;
    margin-bottom:16px;
}

/* 文本与标题 */
.section-title{
    font-size:24px;
    font-weight:700;
    color:#059669;
    margin-bottom:20px;
    text-align:center;
}
.info-text{
    font-size:14px;
    color:#374151;
    margin-bottom:8px;
    text-align:center;
}
.info-value{
    font-weight:600;
    color:#1f2937;
}
.amount{
    color:#dc2626;
    font-weight:700;
    font-size:18px;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:30px;
    width:100%;
}
.btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
}
.btn-home{
    background:#059669;
    color:#fff;
}
.btn-detail{
    background:#2563eb;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='customerIndex.html'">←</span>
    支付结果
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="success-icon">✔</div>
    <div class="section-title">支付成功</div>
    
    <div class="info-text">
        订单编号：<span class="info-value">#20250220101</span>
    </div>
    
    <div class="info-text">
        支付金额：<span class="amount">¥1040</span>
    </div>

    <div class="btn-row">
        <div class="btn btn-home" onclick="location.href='customerIndex.html'">返回首页</div>
        <div class="btn btn-detail" onclick="location.href='reservationDetail.html'">查看订单</div>
    </div>

</div>

    </div>
</div>

</body>
</html>
