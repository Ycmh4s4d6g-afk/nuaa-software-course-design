<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>这里写页面标题</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:16px;
    box-sizing:border-box;
}

/* 文本与标题 */
.section-title{
    font-size:16px;
    font-weight:600;
    margin:6px 0 10px;
}
.sub-text{
    font-size:13px;
    color:#6b7280;
}

/* 表单控件 */
.field{
    margin-bottom:12px;
}
.field-label{
    font-size:13px;
    margin-bottom:4px;
    color:#4b5563;
}
.input, select{
    width:100%;
    height:40px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:0 10px;
    font-size:13px;
    box-sizing:border-box;
}
textarea{
    width:100%;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding:8px 10px;
    font-size:13px;
    box-sizing:border-box;
    resize:none;
}

/* 按钮 */
.btn-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}
.btn-primary, .btn-secondary, .btn-outline{
    flex:1;
    text-align:center;
    padding:10px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
}
.btn-primary{
    background:#2563eb;
    color:#fff;
    border:none;
}
.btn-secondary{
    background:#f97316;
    color:#fff;
    border:none;
}
.btn-outline{
    background:#fff;
    color:#2563eb;
    border:1px solid #2563eb;
}

/* 列表 / 卡片 */
.card{
    background:#f9fafb;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:10px;
    box-sizing:border-box;
}
.card-title{
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
}
.card-meta{
    font-size:12px;
    color:#6b7280;
}
.card-tag-row{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    font-size:12px;
    color:#6b7280;
}
.tag-pill{
    display:inline-block;
    padding:3px 8px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    font-size:11px;
}

/* 底部导航提示 */
.bottom-hint{
    font-size:11px;
    color:#9ca3af;
    text-align:center;
    padding:6px 0 4px;
}

/* 小图标行 */
.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
}

/* 分割线 */
.divider{
    height:1px;
    background:#e5e7eb;
    margin:10px 0;
}

/* 评论 A 样式（你选的版本） */
.comment-item{
    display:flex;
    padding:10px 2px;
    border-bottom:1px solid #f2f3f5;
}
.comment-avatar{
    width:26px;height:26px;border-radius:50%;
    background:#1e90ff;margin-right:10px;
}
.comment-body{flex:1;}
.comment-text{font-size:13px;color:#333;margin-bottom:4px;}
.comment-time{font-size:11px;color:#888;}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

       <div class="header">
    <span class="back"></span>
    酒店预订系统
    <span class="logo">v1.0</span>
</div>
<div class="header">
    <span class="back" onclick="history.back()">←</span>
    用户注册
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="section-title">创建新账户</div>

    <div class="field">
        <div class="field-label">昵称</div>
        <input class="input" placeholder="用于展示的用户名">
    </div>
    <div class="field">
        <div class="field-label">手机号</div>
        <input class="input" placeholder="用于登录与接收通知">
    </div>
    <div class="field">
        <div class="field-label">邮箱</div>
        <input class="input" placeholder="可选，用于找回密码">
    </div>
    <div class="field">
        <div class="field-label">登录密码</div>
        <input type="password" class="input" placeholder="设置登录密码">
    </div>
    <div class="field">
        <div class="field-label">确认密码</div>
        <input type="password" class="input" placeholder="再次输入密码">
    </div>

    <div class="btn-row">
        <div class="btn-primary" onclick="location.href='signin.html'">完成注册</div>
    </div>

    <div class="bottom-hint">点击完成注册视为同意本系统的服务条款与隐私政策。</div>
</div>

    </div>
</div>

</body>
</html>
