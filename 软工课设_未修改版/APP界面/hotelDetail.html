<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>酒店详情 - 酒店预订系统</title>
<style>
/* ==== 通用手机壳 + UI 样式，一份复制到所有页面 ==== */
body{
    margin:0;
    background:#d9d9d9;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    padding:30px 0;
    display:flex;
    justify-content:center;
}
.phone{
    width:390px;
    height:780px;
    background:#000;
    border-radius:38px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 25px 55px rgba(0,0,0,.38);
    position:relative;
}
.notch{
    width:160px;
    height:20px;
    background:#111;
    border-radius:14px;
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
}
.screen{
    background:#fff;
    width:100%;
    height:100%;
    border-radius:28px;
    overflow:hidden;
    box-sizing:border-box;
    padding-top:38px;
    display:flex;
    flex-direction:column;
}

/* 顶部栏 */
.header{
    height:52px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:18px;
    font-weight:600;
}
.header .back{
    position:absolute;
    left:16px;
    font-size:20px;
    cursor:pointer;
}
.header .logo{
    position:absolute;
    right:16px;
    font-size:13px;
    color:#6b7280;
}

/* 主内容区域 */
.main{
    flex:1;
    overflow-y:auto;
    padding:0;
    box-sizing:border-box;
}

    /* 图片轮播 */
    .carousel{
    width:100%;
    height:200px;
    overflow:hidden;
    position:relative;
    }
    .carousel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    }

/* 酒店信息 */
.hotel-info{
    padding:16px;
}
.hotel-name{
    font-size:18px;
    font-weight:700;
    margin-bottom:6px;
}
.hotel-meta{
    font-size:13px;
    color:#6b7280;
    margin-bottom:8px;
}
.hotel-price{
    font-size:20px;
    color:#2563eb;
    font-weight:700;
    margin-bottom:16px;
    }

/* 内容区块 */
.section{
    background:#f9fafb;
    padding:16px;
    margin-bottom:12px;
}
.section-title{
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
}
.section-text{
    font-size:13px;
    color:#4b5563;
    line-height:1.6;
}
    .tag{
    display:inline-block;
    padding:4px 10px;
    background:#eff6ff;
    border-radius:6px;
    color:#2563eb;
    font-size:12px;
    margin:4px 6px 4px 0;
    }

/* 按钮区域 */
    .action-box{
    padding:16px;
    display:flex;
    gap:10px;
    }
    .btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    font-size:14px;
    cursor:pointer;
    border:none;
    }
.btn-book{
    background:#22c55e;
    color:#fff;
}
.btn-collect{
    background:#2563eb;
    color:#fff;
}
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="screen">

<div class="header">
    <span class="back" onclick="location.href='hotelList.html'">←</span>
    酒店详情
    <span class="logo">酒店预订系统</span>
</div>

<div class="main">
    <div class="carousel">
        <img src="杭州西湖.jpg" id="imgShow">
    </div>

    <div class="hotel-info">
    <div class="hotel-name">杭州西湖云舍民宿</div>
        <div class="hotel-meta">📍 浙江 · 杭州市 · 西湖区 | ⭐ 4.7分（1258条评价）</div>
        <div class="hotel-price">￥520 起 / 晚</div>
    </div>

    <div class="section">
        <div class="section-title">🏨 酒店简介</div>
        <div class="section-text">
            民宿位于西湖景区核心区域，步行5分钟即可到达湖畔步道。房间均面向湖景，夜间可远眺断桥风光，清晨可闻鸟鸣清风。提供24小时热水、轻食早餐、行李寄存、免费停车等服务。是休闲度假、情侣出行与深度旅游的优选住宿体验。
        </div>
    </div>

    <div class="section">
        <div class="section-title">🛎 设施与服务</div>
        <div>
        <span class="tag">免费WiFi</span>
        <span class="tag">景观房</span>
        <span class="tag">无限时热水</span>
        <span class="tag">自助早餐</span>
        <span class="tag">免费停车位</span>
        <span class="tag">行李寄存</span>
        <span class="tag">智能门锁</span>
        <span class="tag">观景露台</span>
        <span class="tag">24h前台</span>
        </div>
    </div>

    <div class="action-box">
        <div class="btn btn-book" onclick="location.href='createReservation.html'">📅 立即预订</div>
        <div class="btn btn-collect" onclick="location.href='collectionList.html'">⭐ 收藏酒店</div>
    </div>

</div>

    </div>
</div>

<script>
// 简易轮播
let imgs=["杭州西湖.jpg","上海外滩.jpg","紫峰大厦.jpg"];
let i=0;
setInterval(()=>{
    i=(i+1)%imgs.length;
    document.getElementById("imgShow").src=imgs[i];
},4000);
</script>

</body>
</html>
