<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单管理后台 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Noto Sans SC","Segoe UI";}
    header{
        background:linear-gradient(120deg,#2563EB,#1E40AF);
        color:white;padding:16px 40px;font-size:20px;font-weight:600;
        display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 4px 16px rgba(0,0,0,.25);
    }
    header a{color:white;margin-left:20px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    table{
        width:1000px;margin:40px auto;border-collapse:collapse;
        background:white;border-radius:14px;overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,.1);
    }
    th,td{
        border-bottom:1px solid #e5e7eb;padding:13px;font-size:14px;text-align:center;
    }
    th{background:#eff6ff;color:#1e3a8a;font-weight:700;}

    button{
        padding:6px 12px;border:none;border-radius:6px;
        font-size:13px;font-weight:600;cursor:pointer;margin:2px;
    }
    .detail{background:#2563eb;color:white;}
    .audit{background:#16a34a;color:white;}
    .del{background:#dc2626;color:white;}

    button:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div>🗂 订单管理后台</div>
    <nav>
        <a href="adminIndex.html">返回管理主页</a>
        <a href="index.html">回到系统首页</a>
    </nav>
</header>

<table>
    <tr>
        <th>订单编号</th>
        <th>预订用户</th>
        <th>酒店名称</th>
        <th>入住日期</th>
        <th>退房日期</th>
        <th>金额</th>
        <th>状态</th>
        <th>操作</th>
    </tr>

    <tr>
        <td>20250220101</td>
        <td>小陈</td>
        <td>杭州西湖云舍民宿</td>
        <td>2025-02-20</td>
        <td>2025-02-22</td>
        <td>￥1040</td>
        <td style="color:#d97706;font-weight:600;">待审核</td>
        <td>
            <button class="audit" onclick="location.href='auditReservation.html'">审核</button>
            <button class="detail" onclick="location.href='reservationDetail.html'">详情</button>
            <button class="del" onclick="delRow(this)">删除</button>
        </td>
    </tr>

    <tr>
        <td>20250115133</td>
        <td>Alice</td>
        <td>南京紫峰大厦酒店</td>
        <td>2025-01-19</td>
        <td>2025-01-21</td>
        <td>￥980</td>
        <td style="color:#16a34a;font-weight:600;">已通过</td>
        <td>
            <button class="detail" onclick="location.href='reservationDetail.html'">详情</button>
            <button class="del" onclick="delRow(this)">删除</button>
        </td>
    </tr>

    <tr>
        <td>20241228100</td>
        <td>李亮</td>
        <td>上海外滩星程酒店</td>
        <td>2024-12-28</td>
        <td>2024-12-30</td>
        <td>￥720</td>
        <td style="color:#6b7280;font-weight:600;">已取消</td>
        <td>
            <button class="detail" onclick="location.href='reservationDetail.html'">详情</button>
            <button class="del" onclick="delRow(this)">删除</button>
        </td>
    </tr>

</table>

<script>
function delRow(btn){
    if(confirm("确认删除该订单记录？")){
        btn.parentNode.parentNode.remove();
        alert("订单已删除 ✔");
    }
}
</script>

</body>
</html>
