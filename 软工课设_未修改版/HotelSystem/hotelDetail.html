<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>酒店详情 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .page{max-width:1100px;margin:40px auto;padding:0 26px;}
    .hotel-name{font-size:26px;font-weight:700;margin-bottom:6px;}
    .meta{font-size:14px;color:#6b7280;margin-bottom:18px;}
    .price{color:#2563eb;font-size:22px;font-weight:700;margin-bottom:20px;}
    .carousel{width:100%;height:420px;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.1);margin-bottom:30px;}
    .carousel img{width:100%;height:100%;object-fit:cover;}
    section{background:white;border-radius:18px;padding:28px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:26px;}
    section h2{margin:0 0 10px;font-size:20px;}
    .text{line-height:1.8;font-size:14px;color:#4b5563;}
    .tag{display:inline-block;padding:6px 12px;background:#eff6ff;border-radius:6px;color:#2563eb;font-size:13px;margin:4px 6px 0 0;}
    .room-item{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .room-name{font-size:16px;font-weight:600;}
    .room-meta{font-size:13px;color:#64748b;margin-top:4px;}
    .room-price{color:#2563eb;font-weight:700;font-size:18px;white-space:nowrap;}
    .room-book{padding:8px 16px;border:none;border-radius:8px;background:#22c55e;color:white;cursor:pointer;font-size:13px;font-weight:600;margin-top:8px;}
    .post-item{border-bottom:1px solid #e5e7eb;padding:14px 0;}
    .post-item:last-child{border-bottom:none;}
    .post-title{font-weight:600;margin-bottom:4px;}
    .post-meta{font-size:12px;color:#64748b;margin-bottom:6px;}
    .post-content{font-size:14px;color:#4b5563;line-height:1.6;}
    .action-box{display:flex;gap:18px;margin-top:20px;}
    .btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
    .book{background:#22c55e;color:white;}
    .collect{background:#2563eb;color:white;}
    .empty{color:#64748b;font-size:14px;}
</style>
</head>
<body>
<div class="page">
    <div class="carousel"><img id="imgShow" src="杭州西湖.jpg" alt="酒店图片"></div>
    <div class="hotel-name" id="hotelName">加载中...</div>
    <div class="meta" id="hotelMeta"></div>
    <div class="price" id="hotelPrice"></div>
    <section><h2>酒店简介</h2><p class="text" id="hotelDesc"></p></section>
    <section><h2>设施与服务</h2><div id="facilities"></div></section>
    <section><h2>可选房型</h2><div id="roomTypes"><p class="text">加载中...</p></div></section>
    <section><h2>用户评论</h2><div id="posts"><p class="text">加载中...</p></div></section>
    <div class="action-box">
        <button class="btn book" id="btnBook">立即预订</button>
        <button class="btn collect" id="btnCollect">收藏酒店</button>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
var hotelId = getQueryParam('id') || getQueryParam('hotelId') || '1';

async function loadPosts() {
    var postsJson = await apiGet('/hotels/' + hotelId + '/posts?page=1&size=10');
    var box = document.getElementById('posts');
    if (postsJson.code !== 200 || !postsJson.data.records.length) {
        box.innerHTML = '<p class="empty">暂无已通过审核的评论</p>';
        return;
    }
    box.innerHTML = postsJson.data.records.map(function(p) {
        return '<div class="post-item">' +
            '<div class="post-title">' + (p.title || '用户评论') + ' · ⭐ ' + p.score + '</div>' +
            '<div class="post-meta">' + (p.username || '用户') + '</div>' +
            '<div class="post-content">' + p.content + '</div></div>';
    }).join('');
}

async function loadDetail() {
    try {
        var detailJson = await apiGet('/hotels/' + hotelId);
        if (detailJson.code !== 200) {
            alert(detailJson.message || '加载失败');
            return;
        }
        var h = detailJson.data;
        document.getElementById('imgShow').src = hotelImage(h.id);
        document.getElementById('hotelName').textContent = h.hotelName;
        document.getElementById('hotelMeta').textContent = h.city + ' · ' + h.hotelType + ' · ' + h.address + ' | ⭐ ' + h.rating + '分';
        document.getElementById('hotelPrice').textContent = '￥' + h.minPrice + ' 起 / 晚';
        document.getElementById('hotelDesc').textContent = h.description || '暂无介绍';
        document.getElementById('facilities').innerHTML = (h.facilities || []).map(function(f) {
            return '<span class="tag">' + f + '</span>';
        }).join('') || '<span class="text">暂无设施信息</span>';
        document.getElementById('btnBook').onclick = function() {
            location.href = 'createReservation.html?hotelId=' + h.id;
        };

        var roomJson = await apiGet('/hotels/' + hotelId + '/room-types');
        if (roomJson.code === 200 && roomJson.data.length > 0) {
            document.getElementById('roomTypes').innerHTML = roomJson.data.map(function(r) {
                return '<div class="room-item"><div><div class="room-name">' + r.roomTypeName + '</div>' +
                    '<div class="room-meta">' + r.bedType + ' · 可住' + r.capacity + '人 · 剩余' + r.availableRooms + '间' +
                    (r.breakfastIncluded ? ' · 含早' : '') + '</div></div>' +
                    '<div style="text-align:right"><div class="room-price">￥' + r.price + '/晚</div>' +
                    (r.availableRooms > 0
                        ? '<button class="room-book" onclick="location.href=\'createReservation.html?hotelId=' + h.id + '&roomTypeId=' + r.id + '\'">预订此房型</button>'
                        : '<span style="color:#dc2626;font-size:13px;">已满房</span>') +
                    '</div></div>';
            }).join('');
        } else {
            document.getElementById('roomTypes').innerHTML = '<p class="text">暂无可用房型</p>';
        }

        await loadPosts();
        await updateCollectButton();
    } catch (e) {
        alert('无法连接后端，请确认 Spring Boot 已启动');
    }
}

async function updateCollectButton() {
    var btn = document.getElementById('btnCollect');
    if (!localStorage.getItem('userId')) {
        btn.onclick = function() { location.href = 'signin.html?redirect=' + encodeURIComponent('hotelDetail.html?id=' + hotelId); };
        return;
    }
    try {
        var check = await apiGetAuth('/collections/check?hotelId=' + hotelId);
        if (check.code === 200 && check.data) {
            btn.textContent = '已收藏';
            btn.onclick = function() { location.href = 'collectionList.html'; };
        } else {
            btn.textContent = '收藏酒店';
            btn.onclick = collectHotel;
        }
    } catch (e) {
        btn.onclick = collectHotel;
    }
}

async function collectHotel() {
    if (!requireLogin()) return;
    try {
        var json = await apiPost('/collections', { hotelId: Number(hotelId) });
        if (json.code !== 200) {
            alert(json.message || '收藏失败');
            return;
        }
        alert('收藏成功！');
        updateCollectButton();
    } catch (e) {
        alert('无法连接后端');
    }
}

loadDetail();
</script>
</body>
</html>
