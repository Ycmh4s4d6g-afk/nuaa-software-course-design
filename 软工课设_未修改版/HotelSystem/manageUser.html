<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户管理后台 - 酒店预订系统</title>

<style>
    body{
        margin:0;
        background:#f4f6fa;
        font-family:"Segoe UI","Noto Sans SC";
    }
    header{
        background:linear-gradient(120deg,#2563eb,#1e40af);
        padding:16px 40px;
        color:white;
        display:flex;justify-content:space-between;align-items:center;
        font-size:20px;font-weight:600;
        box-shadow:0 4px 15px rgba(0,0,0,.25);
    }
    header a{
        color:white;text-decoration:none;font-size:14px;margin-left:16px;
    }
    header a:hover{opacity:.85;}

    .search-box{
        width:900px;margin:40px auto 10px;
        background:white;padding:18px 26px;border-radius:14px;
        box-shadow:0 2px 12px rgba(0,0,0,.08);
        display:flex;gap:14px;
    }
    input{
        flex:1;padding:10px;border-radius:8px;
        border:1px solid #cbd5e1;font-size:14px;
    }
    button{
        padding:10px 18px;border:none;border-radius:8px;
        cursor:pointer;font-size:14px;font-weight:600;
        transition:.2s;
    }
    .search-btn{background:#2563eb;color:white;}
    .add-btn{background:#16a34a;color:white;}

    table{
        width:900px;margin:20px auto;border-collapse:collapse;
        background:white;border-radius:14px;overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,.1);
    }
    th,td{
        padding:12px;border-bottom:1px solid #e5e7eb;text-align:center;
        font-size:14px;color:#374151;
    }
    th{background:#eff6ff;font-weight:700;color:#1e3a8a;}

    .edit{background:#0284c7;color:white;border-radius:6px;padding:6px 12px;margin:2px;}
    .del{background:#dc2626;color:white;border-radius:6px;padding:6px 12px;margin:2px;}
    .edit:hover,.del:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div>👤 用户管理后台</div>
    <nav>
        <a href="adminIndex.html">返回首页</a>
        <a href="adminSignin.html">退出登录</a>
    </nav>
</header>

<!-- 🔎 用户搜索框 -->
<div class="search-box">
    <input id="searchInput" type="text" placeholder="输入姓名 / 手机号 / 邮箱 搜索用户">
    <button class="search-btn" onclick="searchUser()">搜索</button>
</div>

<!-- 📄 用户列表 -->
<table id="userTable">
    <tr>
        <th>用户ID</th>
        <th>用户名</th>
        <th>邮箱</th>
        <th>手机号</th>
        <th>状态</th>
        <th>操作</th>
    </tr>

    <tr>
        <td>U20250101</td>
        <td>李明</td>
        <td>chen@mail.com</td>
        <td>13812345678</td>
        <td style="color:#16a34a;font-weight:600;">正常</td>
        <td>
            <button class="edit" onclick="location.href='changeUserInfo.html'">修改</button>
            <button class="del" onclick="deleteUser(this)">删除</button>
        </td>
    </tr>

    <tr>
        <td>U20240215</td>
        <td>王敏</td>
        <td>min@mail.com</td>
        <td>13699881562</td>
        <td style="color:#dc2626;font-weight:600;">已注销</td>
        <td>
            <button class="edit" onclick="location.href='changeUserInfo.html'">修改</button>
            <button class="del" onclick="deleteUser(this)">删除</button>
        </td>
    </tr>

    <tr>
        <td>U20250111</td>
        <td>Alice</td>
        <td>alice@gmail.com</td>
        <td>13755664421</td>
        <td style="color:#16a34a;font-weight:600;">正常</td>
        <td>
            <button class="edit" onclick="location.href='changeUserInfo.html'">修改</button>
            <button class="del" onclick="deleteUser(this)">删除</button>
        </td>
    </tr>
</table>

<script>
function searchUser(){
    let keyword = searchInput.value.trim();
    if(keyword === "") return alert("请输入搜索关键字！");
    alert("正在搜索包含：" + keyword + " 的用户记录（演示）");
}

function deleteUser(btn){
    if(confirm("⚠ 确认删除该用户？删除后无法恢复！")){
        btn.parentNode.parentNode.remove();
        alert("已删除");
    }
}
</script>

</body>
</html>
