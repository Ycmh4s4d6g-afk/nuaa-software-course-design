<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <link rel="stylesheet" href="css/common.css">
<title>用户管理后台 - 酒店预订系统</title>

<style>
    body{
        margin:0;
        background:#f4f6fa;
        font-family:"Segoe UI","Noto Sans SC";
    }
    header{
        background:linear-gradient(120deg,#2563eb,#1e40af);
        padding:16px 40px;
        color:white;
        display:flex;justify-content:space-between;align-items:center;
        font-size:20px;font-weight:600;
        box-shadow:0 4px 15px rgba(0,0,0,.25);
    }
    header a{
        color:white;text-decoration:none;font-size:14px;margin-left:16px;
    }
    header a:hover{opacity:.85;}

    .search-box{
        width:900px;margin:40px auto 10px;
        background:white;padding:18px 26px;border-radius:14px;
        box-shadow:0 2px 12px rgba(0,0,0,.08);
        display:flex;gap:14px;
    }
    input{
        flex:1;padding:10px;border-radius:8px;
        border:1px solid #cbd5e1;font-size:14px;
    }
    button{
        padding:10px 18px;border:none;border-radius:8px;
        cursor:pointer;font-size:14px;font-weight:600;
        transition:.2s;
    }
    .search-btn{background:#2563eb;color:white;}
    .add-btn{background:#16a34a;color:white;}

    table{
        width:900px;margin:20px auto;border-collapse:collapse;
        background:white;border-radius:14px;overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,.1);
    }
    th,td{
        padding:12px;border-bottom:1px solid #e5e7eb;text-align:center;
        font-size:14px;color:#374151;
    }
    th{background:#eff6ff;font-weight:700;color:#1e3a8a;}

    .edit{background:#0284c7;color:white;border-radius:6px;padding:6px 12px;margin:2px;}
    .del{background:#dc2626;color:white;border-radius:6px;padding:6px 12px;margin:2px;}
    .edit:hover,.del:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<!-- 🔎 用户搜索框 -->
<div class="search-box">
    <input id="searchInput" type="text" placeholder="输入姓名 / 手机号 / 邮箱 搜索用户">
    <button class="search-btn" onclick="searchUser()">搜索</button>
</div>

<!-- 📄 用户列表 -->
<table id="userTable">
    <tr>
        <th>用户ID</th>
        <th>用户名</th>
        <th>邮箱</th>
        <th>手机号</th>
        <th>角色</th>
        <th>状态</th>
        <th>操作</th>
    </tr>
</table>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function loadUsers() {
    if (!requireAdmin()) return;
    var kw = document.getElementById('searchInput').value.trim();
    var url = '/admin/users?page=1&size=50';
    if (kw) url += '&keyword=' + encodeURIComponent(kw);
    var json = await apiGetAuth(url);
    if (json.code !== 200) { alert(json.message || '加载失败'); return; }
    var tbody = '';
    (json.data.records || []).forEach(function(u) {
        var stColor = u.status === 'NORMAL' ? '#16a34a' : (u.status === 'DISABLED' ? '#dc2626' : '#6b7280');
        var btn = u.status === 'NORMAL'
            ? '<button class="del" onclick="toggleStatus(' + u.id + ',\'DISABLED\')">禁用</button>'
            : (u.status === 'DISABLED' ? '<button class="edit" onclick="toggleStatus(' + u.id + ',\'NORMAL\')">恢复</button>' : '-');
        if (u.role === 'ADMIN') btn = '-';
        tbody += '<tr><td>' + u.id + '</td><td>' + u.username + '</td><td>' + (u.email || '-') + '</td><td>' + u.phone + '</td><td>' + userRoleText(u.role) + '</td><td style="color:' + stColor + ';font-weight:600;">' + userStatusText(u.status) + '</td><td>' + btn + '</td></tr>';
    });
    document.getElementById('userTable').innerHTML = '<tr><th>用户ID</th><th>用户名</th><th>邮箱</th><th>手机号</th><th>角色</th><th>状态</th><th>操作</th></tr>' + tbody;
}

async function toggleStatus(id, status) {
    if (!confirm(status === 'DISABLED' ? '确认禁用该用户？' : '确认恢复该用户？')) return;
    var json = await apiPut('/admin/users/' + id + '/status', { status: status });
    if (json.code !== 200) { alert(json.message || '操作失败'); return; }
    loadUsers();
}

function searchUser() { loadUsers(); }
loadUsers();
</script>
</body>
</html>
