<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>我的预订 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .page{max-width:1100px;margin:40px auto;padding:0 26px;}
    .title{font-size:24px;font-weight:700;margin-bottom:6px;}
    .sub{font-size:13px;color:#64748b;margin-bottom:26px;}
    .order{background:white;border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.07);display:flex;gap:18px;align-items:center;}
    .img{width:160px;height:108px;border-radius:10px;overflow:hidden;flex-shrink:0;}
    .img img{width:100%;height:100%;object-fit:cover;}
    .info-flex{flex:1;}
    .hotel-name{font-size:18px;font-weight:600;margin-bottom:4px;}
    .meta{font-size:13px;color:#6b7280;margin-bottom:6px;}
    .price{color:#2563eb;font-weight:700;font-size:15px;}
    .status{font-size:13px;font-weight:600;margin-top:4px;}
    .act{display:flex;flex-direction:column;gap:6px;}
    button{padding:6px 14px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
    .detail{background:#2563eb;color:white;}
    .modify{background:#22c55e;color:white;}
    .empty{text-align:center;padding:40px;color:#64748b;background:white;border-radius:14px;}
</style>
</head>
<body>
<div class="page">
    <div class="title">历史预订订单</div>
    <div class="sub">数据来自后端接口，登录后可查看</div>
    <div id="orderList"><p class="empty">加载中...</p></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
function renderOrders(records) {
    var box = document.getElementById('orderList');
    if (!records || records.length === 0) {
        box.innerHTML = '<div class="empty">暂无预订订单，<a href="hotelList.html">去预订</a></div>';
        return;
    }
    box.innerHTML = records.map(function(o) {
        var color = reservationStatusColor(o.status);
        var text = reservationStatusText(o.status);
        var acts = '<button class="detail" onclick="location.href=\'reservationDetail.html?id=' + o.id + '\'">查看详情</button>';
        if (o.status === 'PENDING_PAYMENT') {
            acts += '<button class="modify" onclick="location.href=\'createPayment.html?reservationId=' + o.id + '\'">去支付</button>';
        }
        return '<div class="order">' +
            '<div class="img"><img src="' + hotelImage(o.hotelId) + '" alt="酒店"></div>' +
            '<div class="info-flex">' +
            '<div class="hotel-name">' + o.hotelName + '</div>' +
            '<div class="meta">订单号：' + o.reservationNo + '<br>入住：' + o.checkInDate + ' · 离店：' + o.checkOutDate +
            '<br>房型：' + (o.roomTypeName || '-') + ' · ' + o.roomCount + '间 · ' + o.guestCount + '人</div>' +
            '<div class="price">¥ ' + o.totalAmount + '</div>' +
            '<div class="status" style="color:' + color + ';">' + text + '</div></div>' +
            '<div class="act">' + acts + '</div></div>';
    }).join('');
}

async function loadOrders() {
    if (!requireLogin()) return;
    try {
        var json = await apiGetAuth('/reservations/my?page=1&size=20');
        if (json.code !== 200) {
            alert(json.message || '加载失败');
            return;
        }
        renderOrders(json.data.records);
    } catch (e) {
        alert('无法连接后端，请确认 Spring Boot 已启动');
    }
}

loadOrders();
</script>
</body>
</html>
