<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <link rel="stylesheet" href="css/common.css">
<title>订单管理后台 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Noto Sans SC","Segoe UI";}
    header{
        background:linear-gradient(120deg,#2563EB,#1E40AF);
        color:white;padding:16px 40px;font-size:20px;font-weight:600;
        display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 4px 16px rgba(0,0,0,.25);
    }
    header a{color:white;margin-left:20px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    table{
        width:1000px;margin:40px auto;border-collapse:collapse;
        background:white;border-radius:14px;overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,.1);
    }
    th,td{
        border-bottom:1px solid #e5e7eb;padding:13px;font-size:14px;text-align:center;
    }
    th{background:#eff6ff;color:#1e3a8a;font-weight:700;}

    button{
        padding:6px 12px;border:none;border-radius:6px;
        font-size:13px;font-weight:600;cursor:pointer;margin:2px;
    }
    .detail{background:#2563eb;color:white;}
    .audit{background:#16a34a;color:white;}
    .del{background:#dc2626;color:white;}

    button:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<table id="resTable">
    <tr>
        <th>订单编号</th><th>预订用户</th><th>酒店名称</th><th>入住日期</th><th>退房日期</th><th>金额</th><th>状态</th><th>操作</th>
    </tr>
</table>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function loadList() {
    if (!requireAdmin()) return;
    var json = await apiGetAuth('/admin/reservations?page=1&size=50');
    if (json.code !== 200) { alert(json.message); return; }
    var rows = (json.data.records || []).map(function(r) {
        var auditBtn = r.status === 'PAID' ? '<button class="audit" onclick="location.href=\'auditReservation.html?id=' + r.id + '\'">审核</button>' : '';
        return '<tr><td>' + r.reservationNo + '</td><td>' + (r.username || r.contactName) + '</td><td>' + (r.hotelName || '-') + '</td><td>' + r.checkInDate + '</td><td>' + r.checkOutDate + '</td><td>￥' + r.totalAmount + '</td><td>' + reservationStatusText(r.status) + '</td><td>' + auditBtn + '<button class="detail" onclick="location.href=\'auditReservation.html?id=' + r.id + '\'">详情</button></td></tr>';
    }).join('');
    document.getElementById('resTable').innerHTML = '<tr><th>订单编号</th><th>预订用户</th><th>酒店名称</th><th>入住日期</th><th>退房日期</th><th>金额</th><th>状态</th><th>操作</th></tr>' + rows;
}
loadList();
</script>
</body>
</html>
