<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修改密码 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC",sans-serif;}

    /* 顶部导航栏 */
    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    /* 主要内容卡片 */
    .container{
        width:480px;margin:75px auto;
        background:white;padding:38px 42px;border-radius:20px;
        box-shadow:0 4px 18px rgba(0,0,0,.1);
    }
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;}
    .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:26px;}

    /* 输入区域 */
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;margin-bottom:6px;color:#475569;}
    .field input{
        width:100%;padding:10px 14px;border-radius:8px;
        border:1px solid #d4d4d8;font-size:14px;
    }
    .field input:focus{
        border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25);
        outline:none;
    }

    /* 按钮样式 */
    .btn{
        width:100%;padding:12px;border-radius:8px;border:none;
        font-size:15px;font-weight:500;margin-top:6px;
        cursor:pointer;transition:.2s;
    }
    .save{background:#2563eb;color:white;}
    .save:hover{filter:brightness(1.08);}
    .cancel{background:#6b7280;color:white;}
    .cancel:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">🔐 修改密码</div>
    <nav>
        <a href="customerIndex.html">用户中心</a>
        <a href="getUserInfo.html">返回个人信息</a>
        <a href="index.html">首页</a>
    </nav>
</header>

<div class="container">
    <div class="title">安全设置 - 修改密码</div>
    <div class="sub">请注意妥善保管新密码，避免泄露</div>

    <div class="field">
        <label>当前密码</label>
        <input type="password" id="oldPwd" placeholder="输入旧密码">
    </div>

    <div class="field">
        <label>设置新密码</label>
        <input type="password" id="newPwd1" placeholder="至少6位密码">
    </div>

    <div class="field">
        <label>再次输入新密码</label>
        <input type="password" id="newPwd2" placeholder="确认新密码">
    </div>

    <button class="btn save" onclick="changePass()">提交修改</button>
    <button class="btn cancel" onclick="location.href='getUserInfo.html'">返回</button>
</div>

<script>
function changePass(){
    let p1 = document.getElementById("newPwd1").value;
    let p2 = document.getElementById("newPwd2").value;
    if(p1 !== p2){
        alert("两次密码不一致，请重新输入！");
        return;
    }
    alert("修改成功！（演示）即将返回个人信息页");
    location.href="getUserInfo.html";
}
</script>

</body>
</html>
