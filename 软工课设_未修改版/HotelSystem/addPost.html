<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发布评价 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}

    header{
        background:linear-gradient(120deg,#6366f1,#4338ca);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 3px 12px rgba(0,0,0,.18);
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{
        max-width:820px;margin:40px auto;padding:0 26px;
        background:white;border-radius:18px;padding:32px 40px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .title{font-size:24px;font-weight:700;margin-bottom:10px;}
    .sub{font-size:13px;color:#667085;margin-bottom:24px;}

    label{font-size:14px;font-weight:600;margin-bottom:6px;display:block;}
    input,select,textarea{
        width:100%;padding:12px;border-radius:10px;
        border:1px solid #cbd1d9;font-size:14px;margin-bottom:20px;
    }
    textarea{height:150px;resize:none;}

    /* 按钮 */
    .btn-area{display:flex;gap:14px;}
    button{
        flex:1;padding:12px;border:none;border-radius:8px;
        cursor:pointer;font-size:15px;font-weight:600;transition:.2s;
    }
    .pub{background:#4f46e5;color:white;}
    .pub:hover{filter:brightness(1.08);}
    .back{background:#6b7280;color:white;}
    .back:hover{filter:brightness(1.08);}

</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">📝 发布酒店评价</div>
    <nav>
        <a href="listPost.html">返回列表</a>
        <a href="customerIndex.html">用户主页</a>
        <a href="index.html">首页</a>
    </nav>
</header>

<div class="page">

    <div class="title">发表一条评论</div>
    <div class="sub">分享你的入住体验，让更多人参考选择</div>

    <label>选择酒店</label>
    <select id="hotel">
        <option>杭州西湖云舍民宿</option>
        <option>上海外滩星程酒店</option>
        <option>南京紫峰大厦精选酒店</option>
    </select>

    <label>评论标题</label>
    <input type="text" id="title" placeholder="如：景色超赞+服务贴心，值得再来">

    <label>评分 （0 - 5 星）</label>
    <select id="score">
        <option>5 分 ★★★★★</option>
        <option>4 分 ★★★★☆</option>
        <option>3 分 ★★★☆☆</option>
        <option>2 分 ★★☆☆☆</option>
        <option>1 分 ★☆☆☆☆</option>
    </select>

    <label>正文内容</label>
    <textarea id="content" placeholder="输入你的真实评价，包括环境、位置、早餐、服务等体验..."></textarea>

    <div class="btn-area">
        <button class="pub" onclick="publish()">发布</button>
        <button class="back" onclick="location.href='listPost.html'">返回</button>
    </div>

</div>

<script>
function publish(){
    if(!title.value.trim() || !content.value.trim()){
        alert("标题与内容不能为空！");
        return;
    }
    alert("评论发布成功！（演示效果）");
    location.href="listPost.html";
}
</script>

</body>
</html>
