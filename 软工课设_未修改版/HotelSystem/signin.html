<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户登录 - 酒店推荐预订系统</title>
<style>
    body{
        margin:0;background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    }
    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;text-decoration:none;margin-left:18px;font-size:14px;}
    header a:hover{opacity:.85;}

    /* 页面主体 */
    .container{
        width:400px;margin:90px auto;
        background:white;border-radius:18px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
        padding:35px 36px 45px;
    }
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;}
    .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:26px;}

    /* 输入框 */
    .field{margin-bottom:18px;}
    .field label{
        display:block;font-size:13px;color:#475569;margin-bottom:6px;
    }
    .field input{
        width:100%;padding:10px 14px;border-radius:8px;border:1px solid #d4d4d8;
        font-size:14px;outline:none;transition:.2s;
    }
    .field input:focus{
        border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25);
    }

    /* 按钮 */
    .btn{
        width:100%;padding:12px;border-radius:8px;
        background:#2563eb;color:white;font-size:15px;
        border:none;cursor:pointer;font-weight:500;margin-top:6px;
    }
    .btn:hover{filter:brightness(1.07);}

    /* 底部链接 */
    .links{text-align:center;margin-top:14px;font-size:13px;color:#475569;}
    .links a{color:#2563eb;text-decoration:none;margin:0 5px;}
    .links a:hover{text-decoration:underline;}
</style>
</head>
<body>

<!-- 🔷 顶部导航，与首页风格统一 -->
<header>
    <div style="font-size:18px;font-weight:600;letter-spacing:.5px;">🏨 酒店预订系统</div>
    <nav>
        <a href="index.html">首页</a>
        <a href="hotelList.html">酒店查询</a>
        <a href="reservationList.html">我的预订</a>
    </nav>
</header>

<!-- 🔷 登录主体区域 -->
<div class="container">
    <div class="title">欢迎回来</div>
    <div class="sub">登录以继续浏览酒店、管理订单与收藏</div>

    <form onsubmit="event.preventDefault(); login();">
        <div class="field">
            <label>手机号（账号）</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>

        <div class="field">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>

        <button type="submit" class="btn">登录</button>
    </form>

    <div class="links">
        <a href="signupCustomer.html">注册</a> |
        <a href="forgetPassword.html">忘记密码？</a>
    </div>
</div>

<script>
/* 🔹 简易逻辑：直接跳转用户主页 */
function login(){
    // 未来可接后端校验，这里用于界面演示
    alert("登录成功！（演示）正在跳转用户首页...");
    location.href="customerIndex.html";
}
</script>

</body>
</html>
