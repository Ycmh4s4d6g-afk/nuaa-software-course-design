<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>找回密码 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    .container{
        width:460px;margin:80px auto;background:white;
        padding:40px;border-radius:20px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
    }
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;}
    .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:26px;}

    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;margin-bottom:6px;color:#475569;}
    .field input{
        width:100%;padding:10px 14px;border-radius:8px;
        border:1px solid #d1d5db;font-size:14px;
    }
    .field input:focus{
        border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25);
        outline:none;
    }

    .verify-box{
        display:flex;gap:10px;margin-bottom:16px;
    }
    .verify-btn{
        flex:0 0 130px;padding:10px;background:#2563eb;color:white;
        border:none;border-radius:8px;font-size:13px;cursor:pointer;
    }
    .verify-btn:hover{filter:brightness(1.08);}

    .btn{
        width:100%;padding:12px;border:none;border-radius:8px;
        font-size:15px;font-weight:500;margin-top:8px;cursor:pointer;
    }
    .reset{background:#22c55e;color:white;}
    .reset:hover{filter:brightness(1.08);}
    .back{background:#6b7280;color:white;}
    .back:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">🔁 找回密码</div>
    <nav>
        <a href="signin.html">返回登录</a>
        <a href="signupCustomer.html">注册新账号</a>
        <a href="index.html">首页</a>
    </nav>
</header>

<div class="container">
    <div class="title">忘记密码？</div>
    <div class="sub">输入手机号获取验证码并重设密码</div>

    <div class="field">
        <label>手机号</label>
        <input id="phone" type="text" placeholder="请输入注册手机号">
    </div>

    <div class="verify-box">
        <input type="text" id="code" placeholder="验证码（演示无需真实验证）" style="flex:1;">
        <button class="verify-btn" onclick="sendCode()">获取验证码</button>
    </div>

    <button class="btn reset" onclick="resetPwd()">提交验证并重置密码</button>
    <button class="btn back" onclick="location.href='signin.html'">返回登录</button>
</div>

<script>
function sendCode(){
    alert("验证码已发送！（演示）");
}
function resetPwd(){
    if(document.getElementById('phone').value===''||document.getElementById('code').value===''){
        alert("请填写手机号与验证码！");
        return;
    }
    alert("验证通过！即将跳转至设置新密码界面");
    location.href="changePassword.html";
}
</script>

</body>
</html>
