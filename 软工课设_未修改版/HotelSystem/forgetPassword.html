<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>找回密码 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .container{width:460px;margin:80px auto;background:white;padding:40px;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);}
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;}
    .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:26px;}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;margin-bottom:6px;color:#475569;}
    .field input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #d1d5db;font-size:14px;box-sizing:border-box;}
    .tip{font-size:12px;color:#64748b;margin-bottom:16px;}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:500;margin-top:8px;cursor:pointer;}
    .reset{background:#22c55e;color:white;}
    .back{background:#6b7280;color:white;}
</style>
</head>
<body>
<div class="container">
    <div class="title">忘记密码？</div>
    <p class="sub">简化版：输入注册手机号直接重置密码（无需验证码）</p>
    <div class="field"><label>手机号</label><input id="phone" type="text" placeholder="请输入注册手机号"></div>
    <div class="field"><label>新密码</label><input id="newPwd1" type="password" placeholder="至少6位"></div>
    <div class="field"><label>确认新密码</label><input id="newPwd2" type="password"></div>
    <p class="tip">后续可扩展短信验证码功能</p>
    <button class="btn reset" onclick="resetPwd()">重置密码</button>
    <button class="btn back" onclick="location.href='signin.html'">返回登录</button>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function resetPwd() {
    var phone = document.getElementById('phone').value.trim();
    var p1 = document.getElementById('newPwd1').value;
    var p2 = document.getElementById('newPwd2').value;
    if (!phone || !p1) { alert('请填写手机号和新密码'); return; }
    if (p1.length < 6) { alert('新密码至少6位'); return; }
    if (p1 !== p2) { alert('两次密码不一致'); return; }
    try {
        var json = await apiPut('/users/forgot-password', { phone: phone, newPassword: p1 });
        if (json.code !== 200) { alert(json.message || '重置失败'); return; }
        alert('密码已重置，请登录');
        location.href = 'signin.html';
    } catch (e) { alert('无法连接后端'); }
}
</script>
</body>
</html>
