<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>我的收藏 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f5f7fb;font-family:"Segoe UI","Noto Sans SC";}
    .page{max-width:1100px;margin:42px auto;padding:0 26px;}
    .title{font-size:24px;font-weight:700;margin-bottom:6px;}
    .sub{font-size:13px;color:#6b7280;margin-bottom:26px;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
    .card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08);}
    .img{height:180px;}
    .img img{width:100%;height:100%;object-fit:cover;}
    .info{padding:14px 16px;}
    .name{font-size:17px;font-weight:700;margin-bottom:4px;}
    .meta{font-size:13px;color:#71717a;margin-bottom:6px;}
    .price{font-size:15px;font-weight:700;color:#d97706;}
    .btns{padding:12px 16px;border-top:1px solid #ececec;display:flex;gap:10px;}
    button{flex:1;padding:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;}
    .detail{background:#d97706;color:white;}
    .cancel{background:#6b7280;color:white;}
    .empty{text-align:center;padding:40px;color:#64748b;background:white;border-radius:14px;grid-column:1/-1;}
</style>
</head>
<body>
<div class="page">
    <div class="title">已收藏酒店</div></div>
    <div class="sub">数据来自后端接口，可取消收藏或继续预订</div></div>
    <div class="grid" id="colBox"><p class="empty">加载中...</p></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
function renderCollections(records) {
    var box = document.getElementById('colBox');
    if (!records || !records.length) {
        box.innerHTML = '<p class="empty">暂无收藏，<a href="hotelList.html">去逛逛</a></p>';
        return;
    }
    box.innerHTML = records.map(function(c) {
        var h = c.hotel || {};
        return '<div class="card">' +
            '<div class="img"><img src="' + hotelImage(h.id || c.hotelId) + '" alt=""></div>' +
            '<div class="info"><div class="name">' + (h.hotelName || '酒店') + '</div>' +
            '<div class="meta">' + (h.city || '') + ' · ⭐ ' + (h.rating || '-') + '</div>' +
            '<div class="price">￥' + (h.minPrice || '-') + ' / 晚</div></div>' +
            '<div class="btns">' +
            '<button class="detail" onclick="location.href=\'hotelDetail.html?id=' + c.hotelId + '\'">查看详情</button>' +
            '<button class="cancel" onclick="cancelCollect(' + c.id + ')">取消收藏</button></div></div>';
    }).join('');
}

async function cancelCollect(id) {
    if (!confirm('确定取消收藏？')) return;
    var json = await apiDelete('/collections/' + id);
    if (json.code !== 200) { alert(json.message || '取消失败'); return; }
    loadCollections();
}

async function loadCollections() {
    if (!requireLogin()) return;
    try {
        var json = await apiGetAuth('/collections/my?page=1&size=20');
        if (json.code !== 200) { alert(json.message || '加载失败'); return; }
        renderCollections(json.data.records);
    } catch (e) { alert('无法连接后端'); }
}

loadCollections();
</script>
</body>
</html>
