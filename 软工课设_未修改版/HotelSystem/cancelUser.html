<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注销账户 - 酒店预订系统</title>

<style>
    body{margin:0;background:#fff7f7;font-family:"Segoe UI","Noto Sans SC";}

    /* 顶部栏 */
    header{
        background:linear-gradient(120deg,#ef4444,#dc2626);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    /* 主体容器 */
    .box{
        width:500px;margin:80px auto;
        background:white;border-radius:20px;
        padding:36px 40px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
        border-top:4px solid #dc2626;
    }

    .title{text-align:center;font-size:22px;font-weight:700;color:#dc2626;margin-bottom:6px;}
    .sub{text-align:center;font-size:13px;color:#6b7280;margin-bottom:26px;}

    .warn{
        background:#fee2e2;color:#991b1b;
        font-size:14px;padding:14px;border-radius:10px;
        border-left:4px solid #dc2626;margin-bottom:22px;
    }

    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;margin-bottom:6px;color:#6b7280;}
    .field input{
        width:100%;padding:10px;border-radius:8px;
        border:1px solid #d4d4d8;font-size:14px;
    }

    /* 按钮 */
    .btn{
        width:100%;padding:12px;border-radius:8px;border:none;
        font-size:15px;font-weight:600;margin-top:6px;
        cursor:pointer;transition:.2s;
    }
    .danger{background:#dc2626;color:white;}
    .danger:hover{filter:brightness(1.08);}
    .cancel{background:#6b7280;color:white;}
    .cancel:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">⚠ 危险操作：注销账号</div>
    <nav>
        <a href="customerIndex.html">返回用户主页</a>
        <a href="getUserInfo.html">个人信息</a>
        <a href="index.html">首页</a>
    </nav>
</header>

<div class="box">
    <div class="title">确认删除账户？</div>
    <div class="sub">注销后所有信息将无法恢复，请谨慎操作！</div>

    <div class="warn">
        删除账号后所有预订、收藏、评论、支付记录将被清除且不可找回。  
        若你仍然希望继续操作，请输入现密码进行验证。
    </div>

    <div class="field">
        <label>输入登录密码以验证身份</label>
        <input type="password" id="pwd" placeholder="请输入密码进行确认">
    </div>

    <button class="btn danger" onclick="del()">确认注销账户</button>
    <button class="btn cancel" onclick="location.href='getUserInfo.html'">取消并返回</button>
</div>

<script>
function del(){
    if(document.getElementById("pwd").value===""){
        alert("请输入密码再继续");
        return;
    }
    alert("账户已注销！（演示）将返回首页");
    location.href="index.html";
}
</script>

</body>
</html>
