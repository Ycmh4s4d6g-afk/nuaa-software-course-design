<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <link rel="stylesheet" href="css/common.css">
<title>编辑评论贴 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}

    header{
        background:linear-gradient(120deg,#6366f1,#4338ca);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 3px 12px rgba(0,0,0,.18);
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{
        max-width:820px;margin:40px auto;padding:0 26px;
        background:white;border-radius:18px;padding:32px 40px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .title{font-size:24px;font-weight:700;margin-bottom:10px;}
    .sub{font-size:13px;color:#667085;margin-bottom:24px;}

    label{font-size:14px;font-weight:600;margin-bottom:6px;display:block;}
    input,select,textarea{
        width:100%;padding:12px;border-radius:10px;
        border:1px solid #cbd1d9;font-size:14px;margin-bottom:20px;
    }
    textarea{height:150px;resize:none;}

    .btn-area{display:flex;gap:14px;}
    button{
        flex:1;padding:12px;border:none;border-radius:8px;
        cursor:pointer;font-size:15px;font-weight:600;transition:.2s;
    }
    .save{background:#4f46e5;color:white;}
    .save:hover{filter:brightness(1.08);}
    .cancel{background:#6b7280;color:white;}
    .cancel:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<div class="page">

    <div class="title">修改我的评论</div>
    <div class="sub">你可以对原有的标题、评分和正文进行调整</div>

    <label>关联酒店</label>
    <select id="hotel">
        <!-- 这里默认选中之前评论关联的酒店 -->
        <option selected>杭州西湖云舍民宿</option>
        <option>上海外滩星程酒店</option>
        <option>南京紫峰大厦精选酒店</option>
    </select>

    <label>评论标题</label>
    <input type="text" id="title" value="西湖云舍民宿 · 湖景真的很治愈">

    <label>评分 （0 - 5 星）</label>
    <select id="score">
        <option selected>5 分 ★★★★★</option>
        <option>4 分 ★★★★☆</option>
        <option>3 分 ★★★☆☆</option>
        <option>2 分 ★★☆☆☆</option>
        <option>1 分 ★☆☆☆☆</option>
    </select>

    <label>正文内容</label>
    <textarea id="content">房间落地窗正对西湖，早上拉开窗帘就能看到湖面和远处山的轮廓，真的非常治愈。
老板人很好，帮忙预定了第二天一早的船票。早餐是现磨豆浆和简单中式早点，虽然不豪华但很干净。
就是周末价格略贵，建议工作日来会更划算。</textarea>

    <div class="btn-area">
        <button class="save" onclick="saveEdit()">保存修改</button>
        <button class="cancel" onclick="history.back()">取消</button>
    </div>

</div>

<script>
function saveEdit(){
    if(!title.value.trim() || !content.value.trim()){
        alert("标题和正文不能为空！");
        return;
    }
    alert("评论修改已保存！（演示效果）");
    // 实际系统中这里会提交到后端，这里用跳转代替
    location.href="displayPost.html";
}
</script>

    <script src="js/common.js"></script>
</body>
</html>
