<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单详情 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}

    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{max-width:900px;margin:40px auto;padding:0 26px;}

    /* 信息卡片 */
    .card{
        background:white;border-radius:18px;padding:26px;
        box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:26px;
    }
    .section-title{font-size:18px;font-weight:700;margin-bottom:12px;}

    .hotel-box{display:flex;gap:20px;}
    .hotel-img{
        width:240px;height:170px;border-radius:14px;overflow:hidden;
        box-shadow:0 3px 10px rgba(0,0,0,.1);
    }
    .hotel-img img{
        width:100%;height:100%;object-fit:cover;
    }
    .hotel-info{flex:1;}
    .hotel-name{font-size:20px;font-weight:700;margin-bottom:6px;}
    .hotel-meta{font-size:13px;color:#64748b;margin-bottom:8px;}
    .price{color:#2563eb;font-weight:700;font-size:18px;}

    /* 订单详情表格 */
    table{width:100%;border-collapse:collapse;margin-top:12px;}
    td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px;color:#374151;}
    td.key{width:140px;color:#6b7280;}

    .status{
        font-size:15px;font-weight:700;margin-top:6px;
        color:#22c55e;
    }

    /* 操作按钮区 */
    .btn-area{
        display:flex;gap:16px;margin-top:22px;
    }
    button{
        flex:1;padding:12px;border-radius:8px;border:none;
        cursor:pointer;font-size:15px;font-weight:600;transition:.2s;
    }
    .edit{background:#2563eb;color:white;}
    .edit:hover{filter:brightness(1.08);}
    .cancel{background:#dc2626;color:white;}
    .cancel:hover{filter:brightness(1.08);}
    .back{background:#6b7280;color:white;}
    .back:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">📄 订单详情</div>
    <nav>
        <a href="reservationList.html">返回预订列表</a>
        <a href="customerIndex.html">用户主页</a>
        <a href="index.html">系统首页</a>
    </nav>
</header>

<div class="page">

    <!-- 酒店信息展示 -->
    <div class="card">
        <div class="section-title">🏨 酒店信息</div>

        <div class="hotel-box">
            <div class="hotel-img"><img src="杭州西湖.jpg"></div>
            
            <div class="hotel-info">
                <div class="hotel-name">杭州西湖云舍民宿</div>
                <div class="hotel-meta">📍 浙江省杭州市西湖区 · 湖景民宿 · 高评分4.7</div>
                <div class="price">￥520 / 每晚</div>
            </div>
        </div>
    </div>


    <!-- 订单详细信息块 -->
    <div class="card">
        <div class="section-title">📅 订单详情信息</div>

        <table>
            <tr><td class="key">订单编号</td><td>NO.202501120001</td></tr>
            <tr><td class="key">入住时间</td><td>2025-01-12 14:00</td></tr>
            <tr><td class="key">离店时间</td><td>2025-01-14 12:00</td></tr>
            <tr><td class="key">入住天数</td><td>2 晚</td></tr>
            <tr><td class="key">入住人数</td><td>2 位住客</td></tr>
            <tr><td class="key">订单金额</td><td>¥1040</td></tr>
        </table>

        <div class="status">✔ 状态：已完成</div>

        <div class="btn-area">
            <button class="edit" onclick="location.href='editReservation.html'">修改预订</button>
            <button class="cancel" onclick="alert('订单取消成功（演示）')">取消订单</button>
            <button class="back" onclick="location.href='reservationList.html'">返回列表</button>
        </div>
    </div>
</div>

</body>
</html>
