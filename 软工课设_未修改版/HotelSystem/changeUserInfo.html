<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修改个人信息 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI",Roboto,"Noto Sans SC";}
    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:#fff;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;text-decoration:none;margin-left:18px;font-size:14px;}
    header a:hover{opacity:.85;}

    .container{
        width:480px;margin:75px auto;background:white;
        padding:38px;border-radius:20px;
        box-shadow:0 4px 15px rgba(0,0,0,.07);
    }
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:10px;}
    .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:28px;}

    .field{margin-bottom:18px;}
    .field label{display:block;margin-bottom:6px;color:#475569;font-size:13px;}
    .field input{
        width:100%;padding:10px 14px;
        border:1px solid #d1d5db;border-radius:8px;font-size:14px;
    }
    .field input:focus{
        border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.25);
        outline:none;
    }

    .btn{
        width:100%;padding:12px;font-size:15px;
        border-radius:8px;border:none;cursor:pointer;font-weight:500;
        margin-top:6px;transition:.2s;
    }
    .save{background:#22c55e;color:white;}
    .save:hover{filter:brightness(1.05);}
    .back{background:#2563eb;color:white;}
    .back:hover{filter:brightness(1.05);}
</style>
</head>
<body>

<header>
    <div style="font-weight:600;font-size:18px;">🔧 编辑用户资料</div>
    <nav>
        <a href="index.html">首页</a>
        <a href="customerIndex.html">返回用户主页</a>
        <a href="getUserInfo.html">返回信息页面</a>
    </nav>
</header>

<div class="container">
    <div class="title">修改个人信息</div>
    <div class="sub">更新保存后将覆盖当前账户资料</div>

    <div class="field">
        <label>手机号（账号）</label>
        <input type="text" value="138****XXXX">
    </div>

    <div class="field">
        <label>昵称 / 显示名称</label>
        <input type="text" value="默认用户昵称">
    </div>

    <div class="field">
        <label>个性签名（可选）</label>
        <input type="text" placeholder="输入一句想展示的话">
    </div>

    <button class="btn save" onclick="save()">💾 保存修改</button>
    <button class="btn back" onclick="location.href='getUserInfo.html'">返回</button>
</div>

<script>
function save(){
    alert("信息已修改！（演示）");
    location.href="getUserInfo.html";
}
</script>

</body>
</html>
