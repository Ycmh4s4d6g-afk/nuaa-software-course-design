<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>评论管理后台 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    header{
        background:linear-gradient(120deg,#0ea5e9,#0369a1);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;text-decoration:none;margin-left:18px;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{max-width:1100px;margin:42px auto;padding:0 26px;}
    .title{font-size:24px;font-weight:700;margin-bottom:6px;}
    .sub{font-size:13px;color:#64748b;margin-bottom:28px;}

    .post{
        background:white;border-radius:14px;padding:20px;
        box-shadow:0 4px 16px rgba(0,0,0,.08);
        margin-bottom:18px;
    }
    .head{
        display:flex;justify-content:space-between;align-items:center;
        margin-bottom:6px;
    }
    .post-title{font-size:17px;font-weight:700;color:#111;}
    .status{
        font-size:13px;font-weight:700;padding:4px 10px;
        border-radius:6px;display:inline-block;
    }
    .approved{
        background:#dcfce7;color:#16a34a;border:1px solid #16a34a;
    }
    .pending{
        background:#fff7ed;color:#d97706;border:1px solid #f59e0b;
    }

    .desc{
        font-size:14px;color:#555;margin-top:6px;margin-bottom:10px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .btns{
        display:flex;gap:10px;margin-top:6px;
    }
    button{
        padding:6px 14px;border:none;border-radius:6px;
        font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
    }
    .look{background:#0284c7;color:white;}
    .look:hover{filter:brightness(1.08);}
    .approve{background:#16a34a;color:white;}
    .approve:hover{filter:brightness(1.08);}
    .del{background:#dc2626;color:white;}
    .del:hover{filter:brightness(1.08);}
</style>
</head>

<body>

<header>
    <div style="font-size:18px;font-weight:600;">🛠 评论管理后台</div>
    <nav>
        <a href="adminIndex.html">管理员首页</a>
        <a href="index.html">系统首页</a>
    </nav>
</header>

<div class="page">

    <div class="title">评论审核列表</div>
    <div class="sub">可执行查看 / 审核 / 删除操作</div>

    <!-- 评论1（已审核） -->
    <div class="post">
        <div class="head">
            <div class="post-title">西湖云舍民宿体验 · 景色太赞！</div>
            <span class="status approved">已审核</span>
        </div>
        <div class="desc">房间干净，落地湖景非常治愈，强推！——内容摘要展示……</div>
        <div class="btns">
            <button class="look" onclick="location.href='displayPost.html'">查看详情</button>
            <button class="del" onclick="del(this)">删除评论</button>
        </div>
    </div>

    <!-- 评论2（待审核） -->
    <div class="post">
        <div class="head">
            <div class="post-title">上海外滩酒店环境不错但偏贵</div>
            <span class="status pending">待审核</span>
        </div>
        <div class="desc">酒店位置优越，可步行至外滩，但假日价格偏高，房间一般……</div>
        <div class="btns">
            <button class="look" onclick="location.href='displayPost.html'">查看详情</button>
            <button class="approve" onclick="approve(this)">审核通过</button>
            <button class="del" onclick="del(this)">删除</button>
        </div>
    </div>

    <!-- 评论3 -->
    <div class="post">
        <div class="head">
            <div class="post-title">紫峰大厦夜景超美，一定要住高层！</div>
            <span class="status pending">待审核</span>
        </div>
        <div class="desc">高层景观视野开阔，自助早餐丰富，可泡浴看夜景很享受……</div>
        <div class="btns">
            <button class="look" onclick="location.href='displayPost.html'">查看</button>
            <button class="approve" onclick="approve(this)">审核通过</button>
            <button class="del" onclick="del(this)">删除</button>
        </div>
    </div>

</div>

<script>
function approve(btn){
    btn.parentNode.parentNode.querySelector(".status").className="status approved";
    btn.parentNode.parentNode.querySelector(".status").innerHTML="已审核";
    btn.remove(); //按钮消失
}
function del(btn){
    btn.parentNode.parentNode.remove();
}
</script>

</body>
</html>
