<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>系统通知中心 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .container{max-width:900px;margin:40px auto;padding:0 26px;}
    .head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .title{font-size:24px;font-weight:700;}
    .sub{font-size:13px;color:#64748b;margin-top:4px;}
    .read-all{padding:8px 14px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;}
    .note{background:white;border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.07);border-left:6px solid #2563eb;cursor:pointer;}
    .note.read{opacity:.65;border-left-color:#94a3b8;}
    .note-head{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:4px;}
    .time{font-size:12px;color:#6b7280;font-weight:500;}
    .content{font-size:14px;color:#374151;}
    .empty{text-align:center;padding:40px;color:#64748b;background:white;border-radius:14px;}
</style>
</head>
<body>
<div class="container">
    <div class="head-row">
        <div><div class="title">我的通知</div><div class="sub">未读：<span id="unread">0</span> 条</div></div></div></div>
        <button class="read-all" onclick="readAll()">全部已读</button>
    </div>
    <div id="noteBox"><p class="empty">加载中...</p></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
function renderNotes(records) {
    var box = document.getElementById('noteBox');
    if (!records || !records.length) {
        box.innerHTML = '<p class="empty">暂无通知</p>';
        return;
    }
    box.innerHTML = records.map(function(n) {
        var cls = n.status === 'READ' ? 'note read' : 'note';
        return '<div class="' + cls + '" onclick="markRead(' + n.id + ', this)">' +
            '<div class="note-head"><span>' + n.title + '</span><span class="time">' + formatDateTime(n.createTime) + '</span></div>' +
            '<div class="content">' + n.content + '</div></div></div>';
    }).join('');
}

async function loadUnread() {
    var json = await apiGetAuth('/notifications/unread-count');
    if (json.code === 200) document.getElementById('unread').textContent = json.data;
}

async function markRead(id, el) {
    var json = await apiPut('/notifications/' + id + '/read');
    if (json.code === 200) { el.classList.add('read'); loadUnread(); }
}

async function readAll() {
    var json = await apiPut('/notifications/read-all');
    if (json.code === 200) { loadNotes(); loadUnread(); }
}

async function loadNotes() {
    if (!requireLogin()) return;
    try {
        var json = await apiGetAuth('/notifications/my?page=1&size=20');
        if (json.code !== 200) { alert(json.message || '加载失败'); return; }
        renderNotes(json.data.records);
        loadUnread();
    } catch (e) { alert('无法连接后端'); }
}

loadNotes();
</script>
</body>
</html>
