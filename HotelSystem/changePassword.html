<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>修改密码 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC",sans-serif;}
    .container{width:480px;margin:75px auto;background:white;padding:38px 42px;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.1);}
    .title{text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;}
    .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:26px;}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:13px;margin-bottom:6px;color:#475569;}
    .field input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #d4d4d8;font-size:14px;box-sizing:border-box;}
    .btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:15px;font-weight:500;margin-top:6px;cursor:pointer;}
    .save{background:#2563eb;color:white;}
    .cancel{background:#6b7280;color:white;}
</style>
</head>
<body>
<div class="container">
    <div class="title">安全设置 - 修改密码</div>
    <p class="sub">请注意妥善保管新密码，避免泄露</p>
    <div class="field"><label>当前密码</label><input type="password" id="oldPwd"></div>
    <div class="field"><label>设置新密码</label><input type="password" id="newPwd1" placeholder="至少6位"></div>
    <div class="field"><label>再次输入新密码</label><input type="password" id="newPwd2"></div>
    <button class="btn save" onclick="changePass()">提交修改</button>
    <button class="btn cancel" onclick="location.href='getUserInfo.html'">返回</button>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function changePass() {
    if (!requireLogin()) return;
    var oldPassword = document.getElementById('oldPwd').value;
    var p1 = document.getElementById('newPwd1').value;
    var p2 = document.getElementById('newPwd2').value;
    if (!oldPassword || !p1) { alert('请填写完整'); return; }
    if (p1.length < 6) { alert('新密码至少6位'); return; }
    if (p1 !== p2) { alert('两次密码不一致'); return; }
    try {
        var json = await apiPut('/users/change-password', { oldPassword: oldPassword, newPassword: p1 });
        if (json.code !== 200) { alert(json.message || '修改失败'); return; }
        alert('密码修改成功！');
        location.href = 'getUserInfo.html';
    } catch (e) { alert('无法连接后端'); }
}
</script>
</body>
</html>
