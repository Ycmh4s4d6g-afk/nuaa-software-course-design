<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>发布评价 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .page{max-width:820px;margin:40px auto;padding:32px 40px;background:white;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);}
    .title{font-size:24px;font-weight:700;margin-bottom:10px;}
    .sub{font-size:13px;color:#667085;margin-bottom:24px;}
    label{font-size:14px;font-weight:600;margin-bottom:6px;display:block;}
    input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd1d9;font-size:14px;margin-bottom:20px;box-sizing:border-box;}
    textarea{height:150px;resize:none;}
    .btn-area{display:flex;gap:14px;}
    button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;}
    .pub{background:#4f46e5;color:white;}
    .back{background:#6b7280;color:white;}
</style>
</head>
<body>
<div class="page">
    <div class="title">发表一条评论</div>
    <p class="sub">分享入住体验，提交后需管理员审核</p>
    <label>选择酒店</label>
    <select id="hotelId"><option value="">加载中...</option></select>
    <label>评论标题</label>
    <input type="text" id="title" placeholder="如：景色超赞，值得再来">
    <label>评分（1-5 星）</label>
    <select id="score">
        <option value="5">5 分</option>
        <option value="4">4 分</option>
        <option value="3">3 分</option>
        <option value="2">2 分</option>
        <option value="1">1 分</option>
    </select>
    <label>正文内容</label>
    <textarea id="content" placeholder="输入真实评价..."></textarea>
    <div class="btn-area">
        <button class="pub" onclick="publish()">发布</button>
        <button class="back" onclick="location.href='listPost.html'">返回</button>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function loadHotels() {
    if (!requireLogin()) return;
    var json = await apiGet('/hotels?page=1&size=20');
    if (json.code !== 200) return;
    var sel = document.getElementById('hotelId');
    sel.innerHTML = json.data.records.map(function(h) {
        return '<option value="' + h.id + '">' + h.hotelName + '</option>';
    }).join('');
    var hid = getQueryParam('hotelId');
    if (hid) sel.value = hid;
}

async function publish() {
    var hotelId = document.getElementById('hotelId').value;
    var title = document.getElementById('title').value.trim();
    var content = document.getElementById('content').value.trim();
    var score = parseInt(document.getElementById('score').value, 10);
    if (!hotelId || !content) { alert('请选择酒店并填写内容'); return; }
    var json = await apiPost('/posts', { hotelId: Number(hotelId), title: title, content: content, score: score });
    if (json.code !== 200) { alert(json.message || '发布失败'); return; }
    alert('评论已提交，等待审核');
    location.href = 'listPost.html';
}

loadHotels();
</script>
</body>
</html>
