<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>酒店评论 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f5f6fa;font-family:"Segoe UI","Noto Sans SC";}
    .container{max-width:1050px;margin:42px auto;padding:0 26px;}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .page-title{font-size:24px;font-weight:700;}
    .page-sub{font-size:13px;color:#667085;margin-top:4px;}
    .btn-primary{padding:8px 16px;background:#4f46e5;color:white;border-radius:8px;text-decoration:none;font-size:14px;}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;}
    .post-card{background:white;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);}
    .post-title{font-size:18px;font-weight:700;margin-bottom:6px;}
    .desc{font-size:14px;color:#555;line-height:1.7;}
    .meta{margin-top:12px;font-size:12px;color:#808080;display:flex;justify-content:space-between;}
    .star{color:#fbbf24;font-weight:700;}
    .badge{font-size:12px;padding:2px 8px;border-radius:4px;background:#fef3c7;color:#b45309;}
    .empty{text-align:center;padding:40px;color:#64748b;background:white;border-radius:14px;grid-column:1/-1;}
    .del{margin-top:10px;padding:6px 12px;border:none;background:#dc2626;color:white;border-radius:6px;cursor:pointer;font-size:12px;}
</style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <div><div class="page-title">我的评论</div></div><div class="page-sub">查看已发布评论及审核状态</div></div>
        <a href="addPost.html" class="btn-primary">+ 发布评论</a>
    </div>
    <div class="grid" id="postBox"><p class="empty">加载中...</p></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
function renderPosts(records) {
    var box = document.getElementById('postBox');
    if (!records || !records.length) {
        box.innerHTML = '<p class="empty">暂无评论，<a href="addPost.html">去发布</a></p>';
        return;
    }
    box.innerHTML = records.map(function(p) {
        return '<div class="post-card">' +
            '<div class="post-title">' + (p.hotelName || '酒店') + ' · ' + (p.title || '评论') + '</div>' +
            '<div class="desc">' + p.content + '</div>' +
            '<div class="meta"><span>' + (p.createTime ? formatDateTime(p.createTime) : '') + '</span>' +
            '<span class="star">⭐ ' + p.score + '</span></div>' +
            '<div class="meta"><span class="badge">' + postAuditText(p.auditStatus) + '</span></div></div>' +
            (p.auditStatus !== 'APPROVED' ? '' : '') +
            '<button class="del" onclick="deletePost(' + p.id + ')">删除</button></div>';
    }).join('');
}

async function deletePost(id) {
    if (!confirm('确定删除这条评论？')) return;
    var json = await apiDelete('/posts/' + id);
    if (json.code !== 200) { alert(json.message || '删除失败'); return; }
    loadPosts();
}

async function loadPosts() {
    if (!requireLogin()) return;
    try {
        var json = await apiGetAuth('/posts/my?page=1&size=20');
        if (json.code !== 200) { alert(json.message || '加载失败'); return; }
        renderPosts(json.data.records);
    } catch (e) { alert('无法连接后端'); }
}

loadPosts();
</script>
</body>
</html>
