<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>退款申请 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f5f6fb;font-family:"Segoe UI","Noto Sans SC";}
    .box{width:540px;margin:70px auto;background:white;padding:34px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.1);}
    h2{text-align:center;margin-bottom:10px;}
    label{font-size:14px;font-weight:600;}
    input,textarea{width:100%;margin-top:6px;margin-bottom:18px;padding:10px;border-radius:8px;border:1px solid #d1d5db;box-sizing:border-box;}
    button{width:100%;padding:12px;font-size:15px;font-weight:600;background:#dc2626;color:white;border:none;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>
<div class="box">
    <h2>退款申请</h2>
    <label>订单号</label>
    <input type="text" id="orderNo" readonly>
    <label>退款金额</label>
    <input type="text" id="amount" readonly>
    <label>退款原因说明（可选）</label>
    <textarea id="reason" rows="4" placeholder="如：行程变更"></textarea>
    <button onclick="apply()">提交退款申请</button>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
var reservationId = getQueryParam('reservationId');
var paymentId = null;

async function loadPage() {
    if (!requireLogin()) return;
    if (!reservationId) { alert('缺少订单ID'); return; }
    var res = await apiGetAuth('/reservations/' + reservationId);
    if (res.code !== 200) { alert('订单不存在'); return; }
    document.getElementById('orderNo').value = res.data.reservationNo;
    document.getElementById('amount').value = '￥' + res.data.totalAmount;
    var pay = await apiGetAuth('/payments/reservation/' + reservationId);
    if (pay.code === 200) paymentId = pay.data.id;
}

async function apply() {
    if (!paymentId) { alert('未找到支付记录'); return; }
    if (!confirm('确定申请退款？')) return;
    var json = await apiPut('/payments/' + paymentId + '/refund');
    if (json.code !== 200) { alert(json.message || '退款申请失败'); return; }
    alert('退款申请已提交');
    location.href = 'reservationList.html';
}

loadPage();
</script>
</body>
</html>
