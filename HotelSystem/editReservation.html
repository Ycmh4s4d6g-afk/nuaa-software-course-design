<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <link rel="stylesheet" href="css/common.css">
<title>修改预订订单 - 酒店预订系统</title>

<style>
    body{margin:0;background:#f3f6fb;font-family:"Segoe UI","Noto Sans SC";}

    header{
        background:linear-gradient(120deg,#3b82f6,#2563eb);
        padding:14px 36px;color:white;
        display:flex;justify-content:space-between;align-items:center;
    }
    header a{color:white;margin-left:18px;text-decoration:none;font-size:14px;}
    header a:hover{opacity:.85;}

    .page{max-width:900px;margin:40px auto;padding:0 26px;}

    .card{
        background:white;border-radius:18px;padding:28px;
        margin-bottom:24px;box-shadow:0 4px 18px rgba(0,0,0,.08);
    }
    .title{font-size:22px;font-weight:700;margin-bottom:8px;}

    /* 酒店信息 */
    .hotel-bar{display:flex;gap:22px;}
    .hotel-img{
        width:230px;height:160px;border-radius:14px;overflow:hidden;
        box-shadow:0 4px 12px rgba(0,0,0,.12);
    }
    img{width:100%;height:100%;object-fit:cover;}
    .hotel-info{flex:1;}
    .hotel-name{font-size:20px;font-weight:700;margin-bottom:6px;}
    .hotel-meta{font-size:13px;color:#6b7280;margin-bottom:8px;}
    .price-tag{color:#2563eb;font-size:18px;font-weight:700;}

    /* 订单编辑区 */
    .field{margin-top:16px;}
    .field label{display:block;font-size:14px;margin-bottom:6px;}
    .field input,.field select{
        width:100%;padding:10px;border-radius:8px;
        border:1px solid #cfd2d8;font-size:15px;
    }

    /* 价格显示 */
    .total-box{
        background:#eef6ff;border-left:6px solid #3b82f6;
        padding:16px;border-radius:12px;margin-top:20px;
        font-size:17px;font-weight:700;color:#1e40af;
    }

    /* 按钮区 */
    .btn-area{margin-top:26px;display:flex;gap:14px;}
    button{
        flex:1;padding:12px;border-radius:8px;border:none;
        font-size:15px;font-weight:600;cursor:pointer;transition:.2s;
    }
    .save{background:#22c55e;color:white;}
    .save:hover{filter:brightness(1.08);}
    .cancel{background:#6b7280;color:white;}
    .cancel:hover{filter:brightness(1.08);}

</style>
</head>

<body>

<div class="page">

    <!-- 酒店信息展示 -->
    <div class="card">
        <div class="title">🏨 酒店信息</div>

        <div class="hotel-bar">
            <div class="hotel-img">
                <img src="杭州西湖.jpg">
            </div>
            <div class="hotel-info">
                <div class="hotel-name">杭州西湖云舍民宿</div>
                <div class="hotel-meta">西湖景区核心地段 · 高评分4.7 · 湖景房</div>
                <div class="price-tag">¥ 520 / 每晚</div>
            </div>
        </div>
    </div>

    <!-- 修改订单信息 -->
    <div class="card">
        <div class="title">📅 修改订单信息</div>

        <div class="field">
            <label>入住日期</label>
            <input type="date" id="inDate" value="2025-01-12" onchange="calc()">
        </div>

        <div class="field">
            <label>离店日期</label>
            <input type="date" id="outDate" value="2025-01-14" onchange="calc()">
        </div>

        <div class="field">
            <label>入住人数</label>
            <select id="people">
                <option>1 位</option>
                <option selected>2 位</option>
                <option>3 位</option>
                <option>4 位</option>
            </select>
        </div>

        <div class="total-box" id="totalPrice">
            当前费用：¥ 1040 （2 晚）
        </div>

        <div class="btn-area">
            <button class="save" onclick="saveEdit()">💾 保存修改</button>
            <button class="cancel" onclick="location.href='reservationList.html'">返回</button>
        </div>
    </div>

</div>

<script>
function calc(){
    let price = 520;
    let inDate = new Date(inDateElem.value);
    let outDate = new Date(outDateElem.value);

    let nights = Math.ceil((outDate - inDate) / 86400000);
    if(nights<=0){
        totalPrice.innerHTML="⚠ 日期选择无效";
        return;
    }
    totalPrice.innerHTML=`修改后费用：¥ ${nights * price}（共 ${nights} 晚）`;
}

function saveEdit(){
    alert("订单修改已保存！（演示）");
    location.href="reservationList.html";
}
const inDateElem=document.getElementById("inDate");
const outDateElem=document.getElementById("outDate");
</script>

    <script src="js/common.js"></script>
</body>
</html>
