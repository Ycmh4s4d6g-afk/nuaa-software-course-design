<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/admin-hotel.css">
<title>编辑酒店 - 酒店预订系统</title>
</head>
<body class="admin-form-page" data-nav="admin" data-page-title="编辑酒店">
<div class="page">
    <div class="page-title">编辑酒店</div>
    <div class="page-sub">修改酒店资料；房型与房间数量请在「管理房型」中维护</div>

    <div class="form-section">
        <div class="grid-2">
            <div class="field"><label>酒店名称</label><input type="text" id="hotelName"></div>
            <div class="field"><label>酒店类型</label><input type="text" id="hotelType"></div>
            <div class="field"><label>城市</label><input type="text" id="city"></div>
            <div class="field"><label>详细地址</label><input type="text" id="address"></div>
            <div class="field"><label>起始价格</label><input type="number" id="minPrice" step="0.01"></div>
            <div class="field"><label>评分</label><input type="number" id="rating" step="0.1"></div>
            <div class="field"><label>联系电话</label><input type="text" id="contactPhone"></div>
            <div class="field"><label>设施</label><input type="text" id="facilities"></div>
        </div>
        <div class="field"><label>酒店简介</label><textarea id="description"></textarea></div>
    </div>

    <div class="btn-group">
        <button type="button" class="btn btn-primary" onclick="update()">保存修改</button>
        <button type="button" class="btn btn-outline" onclick="goRoomTypes()">管理房型（大床/双床/间数）</button>
        <button type="button" class="btn btn-secondary" onclick="location.href='manageHotel.html'">返回</button>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
var hotelId = getQueryParam('id');
async function loadHotel() {
    if (!requireAdmin() || !hotelId) { alert('缺少酒店ID'); return; }
    var json = await apiGet('/hotels/' + hotelId);
    if (json.code !== 200) { alert(json.message); return; }
    var h = json.data;
    document.getElementById('hotelName').value = h.hotelName || '';
    document.getElementById('hotelType').value = h.hotelType || '';
    document.getElementById('city').value = h.city || '';
    document.getElementById('address').value = h.address || '';
    document.getElementById('minPrice').value = h.minPrice || '';
    document.getElementById('rating').value = h.rating || '';
    document.getElementById('contactPhone').value = h.contactPhone || '';
    document.getElementById('description').value = h.description || '';
    document.getElementById('facilities').value = (h.facilities || '').replace(/[\[\]"]/g, '').replace(/,/g, ', ');
}
function goRoomTypes() {
    var name = document.getElementById('hotelName').value.trim();
    location.href = 'manageRoomTypes.html?hotelId=' + hotelId + '&hotelName=' + encodeURIComponent(name);
}
async function update() {
    var body = {
        hotelName: document.getElementById('hotelName').value.trim(),
        hotelType: document.getElementById('hotelType').value.trim(),
        city: document.getElementById('city').value.trim(),
        address: document.getElementById('address').value.trim(),
        minPrice: parseFloat(document.getElementById('minPrice').value),
        rating: parseFloat(document.getElementById('rating').value),
        contactPhone: document.getElementById('contactPhone').value.trim(),
        description: document.getElementById('description').value.trim(),
        facilities: document.getElementById('facilities').value.trim(),
        isReservable: 1
    };
    var json = await apiPut('/admin/hotels/' + hotelId, body);
    if (json.code !== 200) { alert(json.message || '失败'); return; }
    alert('已更新');
    location.href = 'manageHotel.html';
}
loadHotel();
</script>
</body>
</html>
