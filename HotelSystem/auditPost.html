<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/common.css">
<title>评论审核 - 酒店预订系统</title>
<style>
    body{margin:0;background:#f4f6fb;font-family:"Noto Sans SC","Segoe UI";}
    .card{max-width:720px;margin:40px auto;background:white;border-radius:18px;padding:26px 30px;box-shadow:0 4px 20px rgba(0,0,0,.12);}
    .meta{font-size:13px;color:#6b7280;margin-bottom:16px;}
    .meta span{margin-right:18px;}
    .content-box{border:1px solid #e5e7eb;background:#f9fafb;padding:14px;border-radius:12px;line-height:1.6;margin-bottom:18px;}
    textarea{width:100%;height:90px;border-radius:10px;border:1px solid #d1d5db;padding:10px;box-sizing:border-box;}
    .btn-area{margin-top:20px;display:flex;gap:14px;}
    button{flex:1;padding:10px;border:none;border-radius:9px;font-weight:600;cursor:pointer;}
    .pass{background:#16a34a;color:white;}
    .reject{background:#dc2626;color:white;}
</style>
</head>
<body>
<div class="card">
    <h2 id="vTitle">评论审核</h2>
    <div class="meta"><span id="vUser"></span><span id="vScore"></span><span id="vTime"></span></div>
    <div class="hotel">关联酒店：<b id="vHotel">-</b></div>
    <div class="content-box" id="vContent"></div>
    <label>审核意见</label>
    <textarea id="comment" placeholder="通过或驳回说明"></textarea>
    <div class="btn-area">
        <button class="pass" onclick="approve()">通过审核</button>
        <button class="reject" onclick="reject()">驳回评论</button>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
var postId = getQueryParam('id');
async function load() {
    if (!requireAdmin() || !postId) return;
    var json = await apiGetAuth('/admin/posts?page=1&size=100');
    if (json.code !== 200) return;
    var p = (json.data.records || []).find(function(x) { return String(x.id) === String(postId); });
    if (!p) { alert('评论不存在'); return; }
    document.getElementById('vTitle').textContent = p.title || '评论';
    document.getElementById('vUser').textContent = '用户：' + (p.username || '');
    document.getElementById('vScore').textContent = '评分：' + p.score + '星';
    document.getElementById('vTime').textContent = formatDateTime(p.createTime);
    document.getElementById('vHotel').textContent = p.hotelName || '';
    document.getElementById('vContent').textContent = p.content || '';
}
async function approve() {
    var json = await apiPut('/admin/posts/' + postId + '/approve', { auditRemark: document.getElementById('comment').value.trim() || '通过' });
    if (json.code !== 200) { alert(json.message); return; }
    alert('已通过'); location.href = 'managePost.html';
}
async function reject() {
    var json = await apiPut('/admin/posts/' + postId + '/reject', { auditRemark: document.getElementById('comment').value.trim() || '驳回' });
    if (json.code !== 200) { alert(json.message); return; }
    alert('已驳回'); location.href = 'managePost.html';
}
load();
</script>
</body>
</html>
